<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" width="640" height="368" role="img" aria-labelledby="t"><title id="t">Memory map of a microcontroller program: vector table, code and constants in flash; initialised data, zeroed data, heap and stack in RAM</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="368" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >Where your variables live</text><text class="ink t" x="130" y="56" text-anchor="middle" >Flash (non-volatile)</text><text class="ink t" x="430" y="56" text-anchor="middle" >SRAM (volatile)</text><rect class="boxa" x="40" y="70" width="180" height="44" rx="8"/><text class="ink t" x="130.0" y="89.0" text-anchor="middle" >Vector table</text><text class="ink2 s" x="130.0" y="105.0" text-anchor="middle" >reset handler address first</text><rect class="box" x="40" y="120" width="180" height="44" rx="8"/><text class="ink t" x="130.0" y="139.0" text-anchor="middle" >.text</text><text class="ink2 s" x="130.0" y="155.0" text-anchor="middle" >your code</text><rect class="box" x="40" y="170" width="180" height="44" rx="8"/><text class="ink t" x="130.0" y="189.0" text-anchor="middle" >.rodata</text><text class="ink2 s" x="130.0" y="205.0" text-anchor="middle" >const data, strings</text><rect class="boxb" x="40" y="220" width="180" height="44" rx="8"/><text class="ink t" x="130.0" y="239.0" text-anchor="middle" >.data initial values</text><text class="ink2 s" x="130.0" y="255.0" text-anchor="middle" >copied to RAM at startup</text><rect class="boxb" x="340" y="70" width="180" height="40" rx="8"/><text class="ink t" x="430.0" y="87.0" text-anchor="middle" >.data</text><text class="ink2 s" x="430.0" y="103.0" text-anchor="middle" >initialised globals</text><rect class="box" x="340" y="114" width="180" height="40" rx="8"/><text class="ink t" x="430.0" y="131.0" text-anchor="middle" >.bss</text><text class="ink2 s" x="430.0" y="147.0" text-anchor="middle" >zeroed globals</text><rect class="box" x="340" y="158" width="180" height="40" rx="8"/><text class="ink t" x="430.0" y="175.0" text-anchor="middle" >heap ↑</text><text class="ink2 s" x="430.0" y="191.0" text-anchor="middle" >malloc, grows up</text><text class="ink3 s" x="430" y="228" text-anchor="middle" >unused: the margin you measure</text><rect class="boxa" x="340" y="246" width="180" height="40" rx="8"/><text class="ink t" x="430.0" y="263.0" text-anchor="middle" >stack ↓</text><text class="ink2 s" x="430.0" y="279.0" text-anchor="middle" >locals, grows down</text><line class="ln" x1="220" y1="240" x2="340" y2="92" marker-end="url(#ar)"/><text class="ink2 s" x="280" y="160" text-anchor="middle" >startup copies</text><text class="ink2 s" x="320" y="306" text-anchor="middle" >Stack overflow eats the heap or .bss silently; the high-water mark tells you how close you are.</text></svg>
