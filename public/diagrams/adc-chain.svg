<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-labelledby="t"><title id="t">Signal chain from sensor through amplifier and anti-alias filter to the ADC and its reference, annotated with the noise entry points</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="290" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >The ADC signal chain and where noise gets in</text><rect class="box" x="20" y="90" width="110" height="50" rx="8"/><text class="ink t" x="75.0" y="112.0" text-anchor="middle" >Sensor</text><text class="ink2 s" x="75.0" y="128.0" text-anchor="middle" >mV, offset, drift</text><rect class="box" x="130" y="90" width="110" height="50" rx="8"/><text class="ink t" x="185.0" y="112.0" text-anchor="middle" >Amplifier</text><text class="ink2 s" x="185.0" y="128.0" text-anchor="middle" >gain, offset, CMRR</text><rect class="box" x="250" y="90" width="110" height="50" rx="8"/><text class="ink t" x="305.0" y="112.0" text-anchor="middle" >Anti-alias filter</text><text class="ink2 s" x="305.0" y="128.0" text-anchor="middle" >fc &lt; fs / 2</text><rect class="boxa" x="370" y="90" width="110" height="50" rx="8"/><text class="ink t" x="425.0" y="112.0" text-anchor="middle" >ADC</text><text class="ink2 s" x="425.0" y="128.0" text-anchor="middle" >N bits, ref, sample time</text><rect class="box" x="500" y="90" width="110" height="50" rx="8"/><text class="ink t" x="555.0" y="112.0" text-anchor="middle" >Code → value</text><text class="ink2 s" x="555.0" y="128.0" text-anchor="middle" >LSB = Vref / 2^N</text><line class="ln" x1="130" y1="115" x2="130" y2="115" marker-end="url(#ar)"/><line class="ln" x1="240" y1="115" x2="250" y2="115" marker-end="url(#ar)"/><line class="ln" x1="360" y1="115" x2="370" y2="115" marker-end="url(#ar)"/><line class="ln" x1="480" y1="115" x2="500" y2="115" marker-end="url(#ar)"/><rect class="boxb" x="380" y="180" width="90" height="36" rx="8"/><text class="ink t" x="425.0" y="195.0" text-anchor="middle" >Vref</text><text class="ink2 s" x="425.0" y="211.0" text-anchor="middle" >noise, drift</text><line class="ln" x1="425" y1="180" x2="425" y2="142" marker-end="url(#ar)"/><text class="amb s" x="75" y="70" text-anchor="middle" >cable pickup</text><line class="ln2" x1="75" y1="74" x2="75" y2="88" marker-end="url(#ar)"/><text class="amb s" x="185" y="70" text-anchor="middle" >amplifier noise</text><line class="ln2" x1="185" y1="74" x2="185" y2="88" marker-end="url(#ar)"/><text class="amb s" x="305" y="70" text-anchor="middle" >aliased noise</text><line class="ln2" x1="305" y1="74" x2="305" y2="88" marker-end="url(#ar)"/><text class="amb s" x="425" y="70" text-anchor="middle" >reference noise, quantisation</text><line class="ln2" x1="425" y1="74" x2="425" y2="88" marker-end="url(#ar)"/><text class="ink2 s" x="320" y="250" text-anchor="middle" >Effective bits = what the noise leaves. Averaging n samples gains log2(√n) bits only if the noise is random.</text><text class="ink2 s" x="320" y="268" text-anchor="middle" >Sample time must suit the source impedance, or the sample capacitor never settles.</text></svg>
