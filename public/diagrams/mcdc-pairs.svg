<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" width="640" height="344" role="img" aria-labelledby="t"><title id="t">Truth table of the decision A and B or C with the independence pairs for each condition and the four-test MC/DC set highlighted</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="344" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >MC/DC for (A &amp;&amp; B) || C: each condition needs a pair that differs only in it</text><text class="ink t" x="40" y="56" text-anchor="middle" >A</text><text class="ink t" x="100" y="56" text-anchor="middle" >B</text><text class="ink t" x="160" y="56" text-anchor="middle" >C</text><text class="ink t" x="230" y="56" text-anchor="middle" >result</text><rect class="box" x="14" y="66" width="244" height="22" rx="4"/><text class="ink2 t" x="40" y="82" text-anchor="middle" >F</text><text class="ink2 t" x="100" y="82" text-anchor="middle" >F</text><text class="ink2 t" x="160" y="82" text-anchor="middle" >F</text><text class="ink2 t" x="230" y="82" text-anchor="middle" >F</text><rect class="boxa" x="14" y="92" width="244" height="22" rx="4"/><text class="ink t" x="40" y="108" text-anchor="middle" >T</text><text class="ink2 t" x="100" y="108" text-anchor="middle" >F</text><text class="ink2 t" x="160" y="108" text-anchor="middle" >F</text><text class="ink2 t" x="230" y="108" text-anchor="middle" >F</text><rect class="boxa" x="14" y="118" width="244" height="22" rx="4"/><text class="ink2 t" x="40" y="134" text-anchor="middle" >F</text><text class="ink t" x="100" y="134" text-anchor="middle" >T</text><text class="ink2 t" x="160" y="134" text-anchor="middle" >F</text><text class="ink2 t" x="230" y="134" text-anchor="middle" >F</text><rect class="boxa" x="14" y="144" width="244" height="22" rx="4"/><text class="ink t" x="40" y="160" text-anchor="middle" >T</text><text class="ink t" x="100" y="160" text-anchor="middle" >T</text><text class="ink2 t" x="160" y="160" text-anchor="middle" >F</text><text class="ink t" x="230" y="160" text-anchor="middle" >T</text><rect class="box" x="14" y="170" width="244" height="22" rx="4"/><text class="ink2 t" x="40" y="186" text-anchor="middle" >F</text><text class="ink2 t" x="100" y="186" text-anchor="middle" >F</text><text class="ink t" x="160" y="186" text-anchor="middle" >T</text><text class="ink t" x="230" y="186" text-anchor="middle" >T</text><rect class="boxa" x="14" y="196" width="244" height="22" rx="4"/><text class="ink t" x="40" y="212" text-anchor="middle" >T</text><text class="ink2 t" x="100" y="212" text-anchor="middle" >F</text><text class="ink t" x="160" y="212" text-anchor="middle" >T</text><text class="ink t" x="230" y="212" text-anchor="middle" >T</text><rect class="box" x="14" y="222" width="244" height="22" rx="4"/><text class="ink2 t" x="40" y="238" text-anchor="middle" >F</text><text class="ink t" x="100" y="238" text-anchor="middle" >T</text><text class="ink t" x="160" y="238" text-anchor="middle" >T</text><text class="ink t" x="230" y="238" text-anchor="middle" >T</text><rect class="box" x="14" y="248" width="244" height="22" rx="4"/><text class="ink t" x="40" y="264" text-anchor="middle" >T</text><text class="ink t" x="100" y="264" text-anchor="middle" >T</text><text class="ink t" x="160" y="264" text-anchor="middle" >T</text><text class="ink t" x="230" y="264" text-anchor="middle" >T</text><text class="ink t" x="300" y="84" text-anchor="start" >Independence pairs</text><text class="ink2 s" x="300" y="100" text-anchor="start" >(differ in one condition, outcome flips)</text><rect class="boxg" x="300" y="112" width="316" height="32" rx="6"/><text class="ink t" x="316" y="133" text-anchor="start" >A:</text><text class="m" x="350" y="133" text-anchor="start" >FTF ↔ TTF</text><text class="ink2 s" x="480" y="133" text-anchor="start" >result F → T</text><rect class="boxg" x="300" y="150" width="316" height="32" rx="6"/><text class="ink t" x="316" y="171" text-anchor="start" >B:</text><text class="m" x="350" y="171" text-anchor="start" >TFF ↔ TTF</text><text class="ink2 s" x="480" y="171" text-anchor="start" >result F → T</text><rect class="boxg" x="300" y="188" width="316" height="32" rx="6"/><text class="ink t" x="316" y="209" text-anchor="start" >C:</text><text class="m" x="350" y="209" text-anchor="start" >TFF ↔ TFT</text><text class="ink2 s" x="480" y="209" text-anchor="start" >result F → T</text><text class="ink2 s" x="300" y="246" text-anchor="start" >Shaded rows TFF, FTF, TTF, TFT: a complete</text><text class="ink2 s" x="300" y="260" text-anchor="start" >MC/DC set, 4 tests for 3 conditions (n + 1).</text><text class="ink2 s" x="300" y="280" text-anchor="start" >Tests TTT and FFF: 100 % decision coverage,</text><text class="ink2 s" x="300" y="294" text-anchor="start" >but no condition shown independent.</text></svg>
