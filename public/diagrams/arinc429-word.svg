<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img" aria-labelledby="t"><title id="t">ARINC 429 32 bit word layout: label, source destination identifier, data field, sign status matrix and parity</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="230" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >An ARINC 429 word: 32 bits, one talker, up to 20 listeners</text><rect class="boxa" x="20.0" y="70" width="150.0" height="44" rx="4"/><text class="ink t" x="95.0" y="96.0" text-anchor="middle" >Label</text><text class="ink2 s" x="95.0" y="128" text-anchor="middle" >bits 1–8, octal, sent first</text><rect class="boxb" x="170.0" y="70" width="37.5" height="44" rx="4"/><text class="ink s" x="188.75" y="96.0" text-anchor="middle" >SDI</text><text class="ink2 s" x="188.75" y="142" text-anchor="middle" >9–10</text><rect class="box" x="207.5" y="70" width="356.2" height="44" rx="4"/><text class="ink t" x="385.625" y="96.0" text-anchor="middle" >Data</text><text class="ink2 s" x="385.625" y="128" text-anchor="middle" >11–29: BNR, BCD or discretes</text><rect class="boxg" x="563.8" y="70" width="37.5" height="44" rx="4"/><text class="ink s" x="582.5" y="96.0" text-anchor="middle" >SSM</text><text class="ink2 s" x="582.5" y="142" text-anchor="middle" >30–31</text><rect class="boxb" x="601.2" y="70" width="18.8" height="44" rx="4"/><text class="ink s" x="610.625" y="96.0" text-anchor="middle" >P</text><text class="ink2 s" x="610.625" y="128" text-anchor="middle" >32</text><text class="ink2 s" x="320" y="150" text-anchor="middle"><tspan x="320" dy="0">Speeds 12.5 or 100 kbit/s; bipolar return-to-zero on a twisted pair; at least four bit times of null</tspan><tspan x="320" dy="14">between words.</tspan></text><text class="ink2 s" x="320" y="184" text-anchor="middle"><tspan x="320" dy="0">Unlike 1553 there is no command/response: a transmitter broadcasts its labels on a schedule and</tspan><tspan x="320" dy="14">receivers pick what they need.</tspan></text></svg>
