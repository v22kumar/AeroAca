<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="280" rx="12"/><text class="ink ttl" x="320" y="26" text-anchor="middle" >Study journey: refresh and defend, build evidence, go deep</text><rect class="boxa" x="20" y="44" width="190" height="196" rx="10"/><text class="ink3 s" x="115" y="66" text-anchor="middle" >Weeks 1–4</text><text class="ink ttl" x="115" y="86" text-anchor="middle" >Refresh &amp; defend</text><text class="ink2 s" x="32" y="112" text-anchor="start" >• 25 interviews · 18 buses</text><text class="ink2 s" x="32" y="130" text-anchor="start" >• 19 voting · 17.1–17.3</text><text class="ink2 s" x="32" y="148" text-anchor="start" >• 20.1–20.2 timing</text><text class="ink2 s" x="32" y="166" text-anchor="start" >• frame parser (5, 23)</text><line class="ln2" x1="32" y1="188" x2="198" y2="188"/><text class="ink3 s" x="115" y="206" text-anchor="middle" >Evidence:</text><text class="ink s" x="115" y="222" text-anchor="middle" >Claims defensible; one component built</text><text class="ink s" x="115" y="236" text-anchor="middle" >, broken, tested</text><line class="ln" x1="210" y1="142" x2="225" y2="142" marker-end="url(#ar)"/><rect class="boxb" x="225" y="44" width="190" height="196" rx="10"/><text class="ink3 s" x="320" y="66" text-anchor="middle" >Weeks 5–8</text><text class="ink ttl" x="320" y="86" text-anchor="middle" >Build evidence</text><text class="ink2 s" x="237" y="112" text-anchor="start" >• 17.4–17.7 coverage</text><text class="ink2 s" x="237" y="130" text-anchor="start" >• 19.3–19.4 voter lab</text><text class="ink2 s" x="237" y="148" text-anchor="start" >• 21.1–21.3 HIL, faults</text><text class="ink2 s" x="237" y="166" text-anchor="start" >• 22 pytest · 23 GDB</text><line class="ln2" x1="237" y1="188" x2="403" y2="188"/><text class="ink3 s" x="320" y="206" text-anchor="middle" >Evidence:</text><text class="ink s" x="320" y="222" text-anchor="middle" >Portfolio stages 2–4; automation with</text><text class="ink s" x="320" y="236" text-anchor="middle" >a report</text><line class="ln" x1="415" y1="142" x2="430" y2="142" marker-end="url(#ar)"/><rect class="boxg" x="430" y="44" width="190" height="196" rx="10"/><text class="ink3 s" x="525" y="66" text-anchor="middle" >Weeks 9–12</text><text class="ink ttl" x="525" y="86" text-anchor="middle" >Depth</text><text class="ink2 s" x="442" y="112" text-anchor="start" >• 21.4–21.5 injection</text><text class="ink2 s" x="442" y="130" text-anchor="start" >• 24 control · 23.4–23.5</text><text class="ink2 s" x="442" y="148" text-anchor="start" >• 20.5 WCET · 14 one-pagers</text><text class="ink2 s" x="442" y="166" text-anchor="start" >• 25.4–25.5 negotiation</text><line class="ln2" x1="442" y1="188" x2="608" y2="188"/><text class="ink3 s" x="525" y="206" text-anchor="middle" >Evidence:</text><text class="ink s" x="525" y="222" text-anchor="middle" >Stages 5–7; Tier-2 mock panels</text><text class="ink3 s" x="320" y="262" text-anchor="middle" >Apply for roles from week one. The order holds even if the dates slide.</text></svg>
