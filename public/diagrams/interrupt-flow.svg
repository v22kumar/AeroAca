<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" width="640" height="356" role="img" aria-labelledby="t"><title id="t">Flow of an interrupt from the peripheral event through enable and priority checks to the handler and return</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="356" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >What happens when an interrupt fires</text><rect class="box" x="160" y="44" width="320" height="38" rx="8"/><text class="ink t" x="320.0" y="60.0" text-anchor="middle" >Peripheral event</text><text class="ink2 s" x="320.0" y="76.0" text-anchor="middle" >flag set in its status register</text><line class="ln" x1="320.0" y1="82" x2="320.0" y2="90" marker-end="url(#ar)"/><rect class="boxb" x="160" y="92" width="320" height="38" rx="8"/><text class="ink t" x="320.0" y="108.0" text-anchor="middle" >Interrupt enabled?</text><text class="ink2 s" x="320.0" y="124.0" text-anchor="middle" >peripheral enable and NVIC enable</text><line class="ln" x1="320.0" y1="130" x2="320.0" y2="138" marker-end="url(#ar)"/><rect class="boxb" x="160" y="140" width="320" height="38" rx="8"/><text class="ink t" x="320.0" y="156.0" text-anchor="middle" >Priority higher than current?</text><text class="ink2 s" x="320.0" y="172.0" text-anchor="middle" >lower number = more urgent</text><line class="ln" x1="320.0" y1="178" x2="320.0" y2="186" marker-end="url(#ar)"/><rect class="box" x="160" y="188" width="320" height="38" rx="8"/><text class="ink t" x="320.0" y="204.0" text-anchor="middle" >Save context, fetch vector</text><text class="ink2 s" x="320.0" y="220.0" text-anchor="middle" >hardware pushes registers</text><line class="ln" x1="320.0" y1="226" x2="320.0" y2="234" marker-end="url(#ar)"/><rect class="boxa" x="160" y="236" width="320" height="38" rx="8"/><text class="ink t" x="320.0" y="252.0" text-anchor="middle" >Handler runs</text><text class="ink2 s" x="320.0" y="268.0" text-anchor="middle" >short; clear the flag; hand off to a task</text><line class="ln" x1="320.0" y1="274" x2="320.0" y2="282" marker-end="url(#ar)"/><rect class="box" x="160" y="284" width="320" height="38" rx="8"/><text class="ink t" x="320.0" y="300.0" text-anchor="middle" >Return</text><text class="ink2 s" x="320.0" y="316.0" text-anchor="middle" >restore, or tail-chain into the next pending</text><text class="ink3 s" x="500" y="109" text-anchor="start" >no → stays pending</text><text class="ink3 s" x="500" y="157" text-anchor="start" >no → waits (preempted later)</text><text class="ink2 s" x="320" y="340" text-anchor="middle" >Shared data between handler and main loop needs a plan: a queue, a flag with an atomic read, or a short critical section.</text></svg>
