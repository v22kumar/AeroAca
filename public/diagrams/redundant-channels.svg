<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 326" width="640" height="326" role="img" aria-labelledby="t"><title id="t">Three redundant flight control channels each with sensors, computer, voter and actuator, joined by cross channel data links</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="326" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >A triplex flight-control architecture with cross-channel data links</text><rect class="box" x="40" y="60" width="70" height="36" rx="8"/><text class="ink t" x="75.0" y="83.0" text-anchor="middle" >Sensors A</text><line class="ln" x1="75" y1="96" x2="75" y2="118" marker-end="url(#ar)"/><rect class="boxa" x="40" y="118" width="150" height="56" rx="8"/><text class="ink t" x="115.0" y="143.0" text-anchor="middle" >Flight computer A</text><text class="ink2 s" x="115.0" y="159.0" text-anchor="middle" >own inputs + the other two</text><line class="ln" x1="115" y1="174" x2="115" y2="196" marker-end="url(#ar)"/><rect class="boxb" x="60" y="196" width="110" height="36" rx="8"/><text class="ink t" x="115.0" y="211.0" text-anchor="middle" >Voter / monitor</text><text class="ink2 s" x="115.0" y="227.0" text-anchor="middle" >mid-value, miscompare</text><line class="ln" x1="115" y1="232" x2="115" y2="254" marker-end="url(#ar)"/><rect class="boxg" x="60" y="254" width="110" height="34" rx="8"/><text class="ink t" x="115.0" y="276.0" text-anchor="middle" >Actuator A</text><rect class="box" x="230" y="60" width="70" height="36" rx="8"/><text class="ink t" x="265.0" y="83.0" text-anchor="middle" >Sensors B</text><line class="ln" x1="265" y1="96" x2="265" y2="118" marker-end="url(#ar)"/><rect class="boxa" x="230" y="118" width="150" height="56" rx="8"/><text class="ink t" x="305.0" y="143.0" text-anchor="middle" >Flight computer B</text><text class="ink2 s" x="305.0" y="159.0" text-anchor="middle" >own inputs + the other two</text><line class="ln" x1="305" y1="174" x2="305" y2="196" marker-end="url(#ar)"/><rect class="boxb" x="250" y="196" width="110" height="36" rx="8"/><text class="ink t" x="305.0" y="211.0" text-anchor="middle" >Voter / monitor</text><text class="ink2 s" x="305.0" y="227.0" text-anchor="middle" >mid-value, miscompare</text><line class="ln" x1="305" y1="232" x2="305" y2="254" marker-end="url(#ar)"/><rect class="boxg" x="250" y="254" width="110" height="34" rx="8"/><text class="ink t" x="305.0" y="276.0" text-anchor="middle" >Actuator B</text><rect class="box" x="420" y="60" width="70" height="36" rx="8"/><text class="ink t" x="455.0" y="83.0" text-anchor="middle" >Sensors C</text><line class="ln" x1="455" y1="96" x2="455" y2="118" marker-end="url(#ar)"/><rect class="boxa" x="420" y="118" width="150" height="56" rx="8"/><text class="ink t" x="495.0" y="143.0" text-anchor="middle" >Flight computer C</text><text class="ink2 s" x="495.0" y="159.0" text-anchor="middle" >own inputs + the other two</text><line class="ln" x1="495" y1="174" x2="495" y2="196" marker-end="url(#ar)"/><rect class="boxb" x="440" y="196" width="110" height="36" rx="8"/><text class="ink t" x="495.0" y="211.0" text-anchor="middle" >Voter / monitor</text><text class="ink2 s" x="495.0" y="227.0" text-anchor="middle" >mid-value, miscompare</text><line class="ln" x1="495" y1="232" x2="495" y2="254" marker-end="url(#ar)"/><rect class="boxg" x="440" y="254" width="110" height="34" rx="8"/><text class="ink t" x="495.0" y="276.0" text-anchor="middle" >Actuator C</text><line class="ln2" x1="190" y1="140" x2="230" y2="140"/><line class="ln2" x1="380" y1="140" x2="420" y2="140"/><text class="ink3 s" x="210" y="132" text-anchor="middle" >CCDL</text><text class="ink3 s" x="400" y="132" text-anchor="middle" >CCDL</text><path class="ln2" d="M115,112 C 200,20 420,20 505,112"/><text class="ink3 s" x="310" y="50" text-anchor="middle" >CCDL (A ↔ C)</text><text class="ink2 s" x="320" y="310" text-anchor="middle" >Each channel computes with all three inputs, votes, and isolates a channel that disagrees persistently. Fail-operational after one fault, fail-safe after two.</text></svg>
