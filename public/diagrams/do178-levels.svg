<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 348" width="640" height="348" role="img" aria-labelledby="t"><title id="t">Table of DO-178C software levels A to E with the associated failure condition, number of objectives and required structural coverage</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="348" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >DO-178C: software level, failure condition, objectives, coverage</text><text class="ink t" x="50.0" y="54" text-anchor="middle" >Level</text><text class="ink t" x="165.0" y="54" text-anchor="middle" >Failure condition</text><text class="ink t" x="285.0" y="54" text-anchor="middle" >Objectives</text><text class="ink t" x="475.0" y="54" text-anchor="middle" >Structural coverage required</text><rect class="boxa" x="20" y="64" width="600" height="32" rx="6"/><text class="ink t" x="50.0" y="85" text-anchor="middle" >A</text><text class="ink s" x="165.0" y="85" text-anchor="middle" >Catastrophic</text><text class="ink t" x="285.0" y="85" text-anchor="middle" >71</text><text class="ink s" x="475.0" y="85" text-anchor="middle" >Statement + decision + MC/DC; data &amp; control coupling</text><rect class="boxa" x="20" y="102" width="600" height="32" rx="6"/><text class="ink t" x="50.0" y="123" text-anchor="middle" >B</text><text class="ink s" x="165.0" y="123" text-anchor="middle" >Hazardous</text><text class="ink t" x="285.0" y="123" text-anchor="middle" >69</text><text class="ink s" x="475.0" y="123" text-anchor="middle" >Statement + decision; data &amp; control coupling</text><rect class="boxb" x="20" y="140" width="600" height="32" rx="6"/><text class="ink t" x="50.0" y="161" text-anchor="middle" >C</text><text class="ink s" x="165.0" y="161" text-anchor="middle" >Major</text><text class="ink t" x="285.0" y="161" text-anchor="middle" >62</text><text class="ink s" x="475.0" y="161" text-anchor="middle" >Statement; data &amp; control coupling</text><rect class="box" x="20" y="178" width="600" height="32" rx="6"/><text class="ink t" x="50.0" y="199" text-anchor="middle" >D</text><text class="ink s" x="165.0" y="199" text-anchor="middle" >Minor</text><text class="ink t" x="285.0" y="199" text-anchor="middle" >26</text><text class="ink s" x="475.0" y="199" text-anchor="middle" >No structural coverage objective</text><rect class="box" x="20" y="216" width="600" height="32" rx="6"/><text class="ink t" x="50.0" y="237" text-anchor="middle" >E</text><text class="ink s" x="165.0" y="237" text-anchor="middle" >No safety effect</text><text class="ink t" x="285.0" y="237" text-anchor="middle" >0</text><text class="ink s" x="475.0" y="237" text-anchor="middle" >Outside DO-178C objectives</text><text class="ink2 s" x="320" y="272" text-anchor="middle"><tspan x="320" dy="0">Objective counts are from DO-178C Annex A (with independence requirements rising with level).</tspan><tspan x="320" dy="14">Coverage is measured from requirements-based tests only.</tspan></text><text class="ink3 s" x="320" y="306" text-anchor="middle"><tspan x="320" dy="0">Working under a level is not being certified to it; say which.</tspan></text></svg>
