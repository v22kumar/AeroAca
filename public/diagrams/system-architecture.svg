    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="280" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >Portfolio product: STM32 sensor monitor, block architecture</text><rect class="box" x="20" y="90" width="100" height="50" rx="8"/><text class="ink t" x="70.0" y="112.0" text-anchor="middle" >Sensor</text><text class="ink2 s" x="70.0" y="128.0" text-anchor="middle" >I2C temperature</text><line class="ln" x1="120" y1="115" x2="160" y2="115" marker-end="url(#ar)"/><rect class="box" x="160" y="90" width="110" height="50" rx="8"/><text class="ink t" x="215.0" y="112.0" text-anchor="middle" >Conditioning</text><text class="ink2 s" x="215.0" y="128.0" text-anchor="middle" >pull-ups, filter</text><line class="ln" x1="270" y1="115" x2="310" y2="115" marker-end="url(#ar)"/><rect class="boxa" x="310" y="70" width="140" height="90" rx="8"/><text class="ink t" x="380.0" y="112.0" text-anchor="middle" >STM32</text><text class="ink2 s" x="380.0" y="128.0" text-anchor="middle" >acquire · detect · log · watchdog</text><line class="ln" x1="450" y1="100" x2="500" y2="100" marker-end="url(#ar)"/><rect class="box" x="500" y="80" width="120" height="40" rx="8"/><text class="ink t" x="560.0" y="97.0" text-anchor="middle" >UART / RS-422</text><text class="ink2 s" x="560.0" y="113.0" text-anchor="middle" >telemetry frames</text><line class="ln" x1="450" y1="140" x2="500" y2="140" marker-end="url(#ar)"/><rect class="boxg" x="500" y="120" width="120" height="40" rx="8"/><text class="ink t" x="560.0" y="137.0" text-anchor="middle" >Host PC</text><text class="ink2 s" x="560.0" y="153.0" text-anchor="middle" >pytest, reports</text><rect class="boxb" x="160" y="190" width="290" height="40" rx="8"/><text class="ink t" x="305.0" y="215.0" text-anchor="middle" >Power: 5 V in → 3.3 V, decoupling, brown-out reset</text><line class="ln" x1="380" y1="190" x2="380" y2="160" marker-end="url(#ar)"/><text class="ink2 s" x="320" y="262" text-anchor="middle" >Simulation (sensor model, fault injection) and hardware (a real board) are recorded as separate evidence paths in the portfolio.</text></svg>
