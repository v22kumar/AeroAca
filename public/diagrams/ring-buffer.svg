<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t"><title id="t">Eight slot ring buffer with head and tail pointers, the full and empty rules, and the single writer single reader condition that makes it lock free</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="300" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >A ring buffer with one writer and one reader</text><path class="box" d="M200,150 L200.0,65.0 A85,85 0 0 1 260.1,89.9 z"/><text class="ink s" x="222.9610059419054" y="98.5672280493228" text-anchor="middle" >0</text><path class="box" d="M200,150 L260.1,89.9 A85,85 0 0 1 285.0,150.0 z"/><text class="ink s" x="255.4327719506772" y="131.0389940580946" text-anchor="middle" >1</text><path class="boxa" d="M200,150 L285.0,150.0 A85,85 0 0 1 260.1,210.1 z"/><text class="ink s" x="255.4327719506772" y="176.9610059419054" text-anchor="middle" >2</text><path class="boxa" d="M200,150 L260.1,210.1 A85,85 0 0 1 200.0,235.0 z"/><text class="ink s" x="222.9610059419054" y="209.4327719506772" text-anchor="middle" >3</text><path class="boxa" d="M200,150 L200.0,235.0 A85,85 0 0 1 139.9,210.1 z"/><text class="ink s" x="177.0389940580946" y="209.4327719506772" text-anchor="middle" >4</text><path class="box" d="M200,150 L139.9,210.1 A85,85 0 0 1 115.0,150.0 z"/><text class="ink s" x="144.5672280493228" y="176.9610059419054" text-anchor="middle" >5</text><path class="box" d="M200,150 L115.0,150.0 A85,85 0 0 1 139.9,89.9 z"/><text class="ink s" x="144.56722804932278" y="131.0389940580946" text-anchor="middle" >6</text><path class="box" d="M200,150 L139.9,89.9 A85,85 0 0 1 200.0,65.0 z"/><text class="ink s" x="177.03899405809457" y="98.56722804932281" text-anchor="middle" >7</text><circle class="bg" cx="200" cy="150" r="38"/><text class="ink2 s" x="200" y="154" text-anchor="middle" >size 8</text><text class="grn t" x="298.8551099787077" y="194.9471272630646" text-anchor="middle" >tail (reader)</text><text class="acc t" x="101.14489002129234" y="194.94712726306466" text-anchor="middle" >head (writer)</text><text class="m" x="470" y="80" text-anchor="start" >Writer: buf[head] = x; head = (head + 1) &amp; 7</text><text class="m" x="470" y="100" text-anchor="start" >Reader: x = buf[tail]; tail = (tail + 1) &amp; 7</text><text class="ink2 s" x="470" y="130" text-anchor="start" >empty: head == tail</text><text class="ink2 s" x="470" y="148" text-anchor="start" >full: (head + 1) &amp; 7 == tail</text><text class="ink3 s" x="470" y="166" text-anchor="start" >(one slot kept free)</text><text class="ink t" x="470" y="196" text-anchor="start" >Why it is safe with no lock:</text><text class="ink2 s" x="470" y="214" text-anchor="start" >each index has exactly one writer;</text><text class="ink2 s" x="470" y="230" text-anchor="start" >the other side only reads it.</text><text class="ink2 s" x="470" y="256" text-anchor="start" >Breaks if: two writers, a non-atomic</text><text class="ink2 s" x="470" y="272" text-anchor="start" >index, or the compiler reorders.</text></svg>
