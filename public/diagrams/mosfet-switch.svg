<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 334" width="640" height="334" role="img" aria-labelledby="t"><title id="t">An N-channel MOSFET switching a 12 volt load on the low side, driven from a 3.3 volt GPIO through a gate resistor, with a flyback diode across the load</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="334" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >An N-channel MOSFET as a low-side switch</text><line class="ln" x1="300" y1="50" x2="560" y2="50"/><text class="ink t" x="300" y="44" text-anchor="start" >V+ 12 V</text><line class="ln" x1="400" y1="50" x2="400" y2="70"/><rect class="boxa" x="372" y="70" width="56" height="40" rx="6"/><text class="ink t" x="400" y="94" text-anchor="middle" >Load</text><line class="ln" x1="400" y1="110" x2="400" y2="132"/><line class="ln" x1="400" y1="60" x2="480" y2="60"/><line class="ln" x1="480" y1="60" x2="480" y2="78"/><path class="ln" d="M470,96 L490,96 L480,78 z"/><line class="ln" x1="470" y1="78" x2="490" y2="78"/><line class="ln" x1="480" y1="96" x2="480" y2="120"/><line class="ln" x1="480" y1="120" x2="400" y2="120"/><text class="ink2 s" x="496" y="92" text-anchor="start" >flyback diode</text><line class="ln" x1="400" y1="132" x2="400" y2="142"/><line class="ln" x1="400" y1="142" x2="372" y2="142"/><line class="ln" x1="372" y1="136" x2="372" y2="170"/><line class="ln" x1="360" y1="140" x2="360" y2="166"/><line class="ln" x1="372" y1="164" x2="400" y2="164"/><line class="ln" x1="400" y1="164" x2="400" y2="186"/><text class="ink2 s" x="410" y="140" text-anchor="start" >D</text><text class="ink2 s" x="410" y="172" text-anchor="start" >S</text><text class="ink2 s" x="352" y="158" text-anchor="end" >G</text><rect class="box" x="40" y="130" width="120" height="46" rx="8"/><text class="ink t" x="100.0" y="150.0" text-anchor="middle" >MCU GPIO</text><text class="ink2 s" x="100.0" y="166.0" text-anchor="middle" >3.3 V logic</text><line class="ln" x1="160" y1="153" x2="230" y2="153"/><rect class="box" x="230" y="143" width="64" height="20" rx="3"/><text class="ink s" x="262" y="157" text-anchor="middle" >Rg 100 Ω</text><line class="ln" x1="294" y1="153" x2="360" y2="153"/><line class="ln" x1="400" y1="186" x2="400" y2="196"/><line class="ln" x1="386" y1="196" x2="414" y2="196"/><line class="ln" x1="390" y1="201" x2="410" y2="201"/><line class="ln" x1="394" y1="206" x2="406" y2="206"/><text class="ink3 s" x="400" y="222" text-anchor="middle" >GND</text><text class="ink2 s" x="320" y="246" text-anchor="middle"><tspan x="320" dy="0">Rules: drive VGS fully on (not just to threshold) · gate charge sets switching loss · a flyback</tspan><tspan x="320" dy="14">diode for inductive loads · conduction loss P = I² × RDS(on).</tspan></text><text class="ink2 s" x="320" y="280" text-anchor="middle"><tspan x="320" dy="0">Low-side means the load sits above the switch, so a 3.3 V GPIO can drive the gate directly if the</tspan><tspan x="320" dy="14">MOSFET is logic-level.</tspan></text></svg>
