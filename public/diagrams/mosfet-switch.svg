<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" role="img" aria-labelledby="t"><title id="t">An N-channel MOSFET switching a 12 volt load on the low side, driven from a 3.3 volt GPIO through a gate resistor, with a flyback diode across the load</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="270" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >An N-channel MOSFET as a low-side switch</text><rect class="box" x="40" y="110" width="120" height="50" rx="8"/><text class="ink t" x="100.0" y="132.0" text-anchor="middle" >MCU GPIO</text><text class="ink2 s" x="100.0" y="148.0" text-anchor="middle" >3.3 V logic</text><line class="ln" x1="160" y1="135" x2="230" y2="135"/><rect class="box" x="230" y="125" width="60" height="20" rx="3"/><text class="ink s" x="260" y="139" text-anchor="middle" >Rg 100 Ω</text><line class="ln" x1="290" y1="135" x2="340" y2="135"/><line class="ln" x1="340" y1="115" x2="340" y2="155"/><line class="ln" x1="352" y1="112" x2="352" y2="158"/><line class="ln" x1="352" y1="120" x2="380" y2="120"/><line class="ln" x1="352" y1="150" x2="380" y2="150"/><line class="ln" x1="380" y1="60" x2="380" y2="120"/><line class="ln" x1="380" y1="150" x2="380" y2="220"/><text class="ink2 s" x="395" y="118" text-anchor="start" >D</text><text class="ink2 s" x="395" y="156" text-anchor="start" >S</text><text class="ink2 s" x="325" y="128" text-anchor="end" >G</text><rect class="box" x="440" y="40" width="120" height="40" rx="8"/><text class="ink t" x="500.0" y="65.0" text-anchor="middle" >V+ 12 V</text><rect class="boxb" x="340" y="40" width="80" height="0"/><rect class="box" x="330" y="10" width="0" height="0" rx="8"/><text class="ink t" x="330.0" y="15.0" text-anchor="middle" ></text><rect class="boxa" x="355" y="62" width="50" height="38" rx="6"/><text class="ink t" x="380" y="85" text-anchor="middle" >Load</text><line class="ln" x1="380" y1="40" x2="380" y2="62"/><line class="ln" x1="380" y1="40" x2="440" y2="40"/><line class="ln" x1="440" y1="40" x2="440" y2="60"/><line class="ln" x1="430" y1="62" x2="430" y2="100"/><path class="ln" d="M424,100 L436,100 L430,88 z"/><line class="ln" x1="424" y1="88" x2="436" y2="88"/><text class="ink2 s" x="448" y="92" text-anchor="start" >flyback diode</text><line class="ln" x1="380" y1="62" x2="430" y2="62"/><line class="ln" x1="380" y1="100" x2="430" y2="100"/><line class="ln" x1="340" y1="220" x2="420" y2="220"/><line class="ln" x1="380" y1="220" x2="380" y2="232"/><line class="ln" x1="370" y1="232" x2="390" y2="232"/><line class="ln" x1="374" y1="236" x2="386" y2="236"/><text class="ink3 s" x="380" y="252" text-anchor="middle" >GND</text><text class="ink2 s" x="60" y="200" text-anchor="start" >Rules: VGS fully on (not just threshold) · gate charge sets switching loss · flyback for inductive loads · P = I² × RDS(on)</text><text class="ink2 s" x="60" y="218" text-anchor="start" >Low-side: the load sits above the switch, so the MCU&#x27;s 3.3 V can drive the gate directly if the MOSFET is logic-level.</text></svg>
