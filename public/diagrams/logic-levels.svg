<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 334" width="640" height="334" role="img" aria-labelledby="t"><title id="t">Driver output levels VOH and VOL against receiver input thresholds VIH and VIL, with the noise margins between them</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="334" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >Logic levels: driver output versus receiver input (3.3 V LVTTL)</text><line class="ln2" x1="60" y1="230.0" x2="550" y2="230.0"/><text class="ink2 s" x="54" y="234.0" text-anchor="end" >0 V</text><line class="ln2" x1="60" y1="208.1818181818182" x2="550" y2="208.1818181818182"/><text class="ink2 s" x="54" y="212.1818181818182" text-anchor="end" >0.4 V</text><line class="ln2" x1="60" y1="186.36363636363637" x2="550" y2="186.36363636363637"/><text class="ink2 s" x="54" y="190.36363636363637" text-anchor="end" >0.8 V</text><line class="ln2" x1="60" y1="120.9090909090909" x2="550" y2="120.9090909090909"/><text class="ink2 s" x="54" y="124.9090909090909" text-anchor="end" >2.0 V</text><line class="ln2" x1="60" y1="99.0909090909091" x2="550" y2="99.0909090909091"/><text class="ink2 s" x="54" y="103.0909090909091" text-anchor="end" >2.4 V</text><line class="ln2" x1="60" y1="50.0" x2="550" y2="50.0"/><text class="ink2 s" x="54" y="54.0" text-anchor="end" >3.3 V</text><rect class="boxg" x="110" y="50.0" width="120" height="49.09090909090909" rx="4"/><text class="ink t" x="170" y="78.54545454545453" text-anchor="middle" >VOH ≥ 2.4 V</text><rect class="boxg" x="110" y="208.1818181818182" width="120" height="21.818181818181813" rx="4"/><text class="ink t" x="170" y="223.0909090909091" text-anchor="middle" >VOL ≤ 0.4 V</text><text class="ink t" x="170" y="250" text-anchor="middle" >Driver guarantees</text><rect class="boxa" x="350" y="50.0" width="120" height="70.9090909090909" rx="4"/><text class="ink t" x="410" y="89.45454545454544" text-anchor="middle" >VIH ≥ 2.0 V reads 1</text><rect class="boxa" x="350" y="186.36363636363637" width="120" height="43.636363636363626" rx="4"/><text class="ink t" x="410" y="212.1818181818182" text-anchor="middle" >VIL ≤ 0.8 V reads 0</text><rect class="boxb" x="350" y="120.9090909090909" width="120" height="65.45454545454547" rx="4"/><text class="ink t" x="410" y="157.63636363636363" text-anchor="middle" >undefined</text><text class="ink t" x="410" y="250" text-anchor="middle" >Receiver requires</text><line class="ln" x1="230" y1="99.0909090909091" x2="350" y2="120.9090909090909" marker-end="url(#ar)"/><line class="ln" x1="230" y1="208.1818181818182" x2="350" y2="186.36363636363637" marker-end="url(#ar)"/><text class="ink2 s" x="320" y="272" text-anchor="middle"><tspan x="320" dy="0">Noise margin high = VOH − VIH = 2.4 − 2.0 = 0.4 V. Noise margin low = VIL − VOL = 0.8 − 0.4 = 0.4 V.</tspan></text><text class="ink2 s" x="320" y="292" text-anchor="middle"><tspan x="320" dy="0">A negative margin can work on the bench and fail in the field. Open-drain outputs reach VOH only</tspan><tspan x="320" dy="14">through the pull-up.</tspan></text></svg>
