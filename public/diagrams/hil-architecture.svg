<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" width="640" height="306" role="img" aria-labelledby="t"><title id="t">Hardware in the loop architecture: a real time target running the plant model drives analogue, bus and fault insertion I/O into the real device under test, orchestrated by a host PC</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="306" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >Hardware-in-the-loop: what is real and what is simulated</text><rect class="boxb" x="40" y="70" width="170" height="120" rx="8"/><text class="ink t" x="125.0" y="127.0" text-anchor="middle" >Real-time target</text><text class="ink2 s" x="125.0" y="143.0" text-anchor="middle" >plant model: aircraft, sensors</text><rect class="box" x="260" y="60" width="120" height="44" rx="8"/><text class="ink t" x="320.0" y="79.0" text-anchor="middle" >Analogue I/O</text><text class="ink2 s" x="320.0" y="95.0" text-anchor="middle" >sensor voltages</text><rect class="box" x="260" y="110" width="120" height="44" rx="8"/><text class="ink t" x="320.0" y="129.0" text-anchor="middle" >Digital / bus I/O</text><text class="ink2 s" x="320.0" y="145.0" text-anchor="middle" >1553, 429, CAN, RS-422</text><rect class="boxa" x="260" y="160" width="120" height="44" rx="8"/><text class="ink t" x="320.0" y="179.0" text-anchor="middle" >Fault insertion</text><text class="ink2 s" x="320.0" y="195.0" text-anchor="middle" >opens, shorts, late frames</text><rect class="boxg" x="430" y="80" width="170" height="100" rx="8"/><text class="ink t" x="515.0" y="127.0" text-anchor="middle" >Device under test</text><text class="ink2 s" x="515.0" y="143.0" text-anchor="middle" >the real flight computer</text><line class="ln" x1="210" y1="82" x2="260" y2="82" marker-end="url(#ar)"/><line class="ln" x1="380" y1="82" x2="430" y2="100" marker-end="url(#ar)"/><line class="ln" x1="210" y1="132" x2="260" y2="132" marker-end="url(#ar)"/><line class="ln" x1="380" y1="132" x2="430" y2="132" marker-end="url(#ar)"/><line class="ln" x1="210" y1="182" x2="260" y2="182" marker-end="url(#ar)"/><line class="ln" x1="380" y1="182" x2="430" y2="160" marker-end="url(#ar)"/><rect class="box" x="40" y="220" width="560" height="40" rx="8"/><text class="ink t" x="320.0" y="245.0" text-anchor="middle" >Host PC: test automation, scenarios, logging, pass/fail</text><line class="ln" x1="125" y1="220" x2="125" y2="192" marker-end="url(#ar)"/><line class="ln" x1="515" y1="220" x2="515" y2="182" marker-end="url(#ar)"/><text class="ink2 s" x="320" y="290" text-anchor="middle" >HIL proves the box with real I/O against a model; it does not prove the model. Loop latency and I/O fidelity are the limits to state.</text></svg>
