<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" width="640" height="336" role="img" aria-labelledby="t"><title id="t">SPI timing diagram in mode 0 with chip select, clock, MOSI and MISO, data sampled on each rising clock edge, most significant bit first</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="336" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >SPI mode 0 (CPOL = 0, CPHA = 0): sample on the rising edge</text><text class="ink t" x="82" y="72" text-anchor="end" >CS</text><path class="sig" d="M60.0,60 L90.0,60 L90.0,60 L90.0,80 L120.0,80 L150.0,80 L180.0,80 L210.0,80 L240.0,80 L270.0,80 L300.0,80 L330.0,80 L360.0,80 L390.0,80 L420.0,80 L450.0,80 L480.0,80 L510.0,80 L540.0,80 L570.0,80 L600.0,80 L600.0,80 L600.0,60 L630.0,60 "/><text class="ink t" x="82" y="122" text-anchor="end" >SCK</text><path class="sig" d="M90,130 L120,130 L120,130 L120,110 L150,110 L150,110 L150,130 L180,130 L180,130 L180,110 L210,110 L210,110 L210,130 L240,130 L240,130 L240,110 L270,110 L270,110 L270,130 L300,130 L300,130 L300,110 L330,110 L330,110 L330,130 L360,130 L360,130 L360,110 L390,110 L390,110 L390,130 L420,130 L420,130 L420,110 L450,110 L450,110 L450,130 L480,130 L480,130 L480,110 L510,110 L510,110 L510,130 L540,130 L540,130 L540,110 L570,110 L570,110 L570,130 L600,130 L630,130 "/><text class="ink t" x="82" y="172" text-anchor="end" >MOSI</text><path class="siga" d="M90,180 L120,180 L150,180 L180,180 L180,180 L180,160 L210,160 L240,160 L270,160 L300,160 L300,160 L300,180 L330,180 L360,180 L360,180 L360,160 L390,160 L420,160 L420,160 L420,180 L450,180 L480,180 L510,180 L540,180 L540,180 L540,160 L570,160 L600,160 L600,160 L600,180 L630,180 "/><text class="ink t" x="82" y="222" text-anchor="end" >MISO</text><path class="sigb" d="M90,230 L120,230 L120,230 L120,210 L150,210 L180,210 L180,210 L180,230 L210,230 L240,230 L270,230 L300,230 L300,230 L300,210 L330,210 L360,210 L360,210 L360,230 L390,230 L420,230 L420,230 L420,210 L450,210 L480,210 L510,210 L540,210 L540,210 L540,230 L570,230 L600,230 L630,230 "/><line class="ln2" x1="120" y1="105" x2="120" y2="235"/><text class="ink3 s" x="120" y="250" text-anchor="middle" >b7</text><line class="ln2" x1="180" y1="105" x2="180" y2="235"/><text class="ink3 s" x="180" y="250" text-anchor="middle" >b6</text><line class="ln2" x1="240" y1="105" x2="240" y2="235"/><text class="ink3 s" x="240" y="250" text-anchor="middle" >b5</text><line class="ln2" x1="300" y1="105" x2="300" y2="235"/><text class="ink3 s" x="300" y="250" text-anchor="middle" >b4</text><line class="ln2" x1="360" y1="105" x2="360" y2="235"/><text class="ink3 s" x="360" y="250" text-anchor="middle" >b3</text><line class="ln2" x1="420" y1="105" x2="420" y2="235"/><text class="ink3 s" x="420" y="250" text-anchor="middle" >b2</text><line class="ln2" x1="480" y1="105" x2="480" y2="235"/><text class="ink3 s" x="480" y="250" text-anchor="middle" >b1</text><line class="ln2" x1="540" y1="105" x2="540" y2="235"/><text class="ink3 s" x="540" y="250" text-anchor="middle" >b0</text><text class="ink2 s" x="320" y="276" text-anchor="middle" ><tspan x="320" dy="0">Mode 1 samples on the falling edge; modes 2 and 3 idle the clock high. A first byte shifted by one</tspan><tspan x="320" dy="14">bit is almost always the wrong mode.</tspan></text></svg>
