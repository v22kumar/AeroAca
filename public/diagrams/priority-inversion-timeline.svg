<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 378" width="640" height="378" role="img" aria-labelledby="t"><title id="t">Two timelines of three tasks: without inheritance the high task waits for the medium task&#x27;s whole run; with a mutex it waits only for the low task&#x27;s critical section</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="378" rx="12"/><text class="ink ttl" x="320" y="22" text-anchor="middle" >Priority inversion: without and with inheritance (L holds the lock 3 ms)</text><text class="ink t" x="20" y="48" text-anchor="start" >Binary semaphore (no inheritance): H finishes at 17 ms</text><text class="ink t" x="72" y="75.0" text-anchor="end" >H</text><line class="ln2" x1="80" y1="84" x2="650" y2="84"/><text class="ink t" x="72" y="105.0" text-anchor="end" >M</text><line class="ln2" x1="80" y1="114" x2="650" y2="114"/><text class="ink t" x="72" y="135.0" text-anchor="end" >L</text><line class="ln2" x1="80" y1="144" x2="650" y2="144"/><rect class="boxb" x="80.0" y="120" width="45.0" height="20" rx="3"/><text class="ink s" x="102.5" y="134.0" text-anchor="middle" >lock</text><rect class="box" x="110.0" y="60" width="465.0" height="20" rx="3"/><text class="ink s" x="342.5" y="74.0" text-anchor="middle" >blocked, waiting for L</text><rect class="boxa" x="125.0" y="90" width="360.0" height="20" rx="3"/><text class="ink s" x="305.0" y="104.0" text-anchor="middle" >M runs 12 ms</text><rect class="boxb" x="485.0" y="120" width="45.0" height="20" rx="3"/><text class="ink s" x="507.5" y="134.0" text-anchor="middle" >lock</text><rect class="boxg" x="530.0" y="60" width="60.0" height="20" rx="3"/><text class="ink s" x="560.0" y="74.0" text-anchor="middle" >H</text><line class="ln" x1="80" y1="152" x2="650" y2="152"/><line class="ln" x1="80" y1="152" x2="80" y2="156"/><text class="ink3 s" x="80" y="168" text-anchor="middle" >0</text><line class="ln" x1="230" y1="152" x2="230" y2="156"/><text class="ink3 s" x="230" y="168" text-anchor="middle" >5</text><line class="ln" x1="380" y1="152" x2="380" y2="156"/><text class="ink3 s" x="380" y="168" text-anchor="middle" >10</text><line class="ln" x1="530" y1="152" x2="530" y2="156"/><text class="ink3 s" x="530" y="168" text-anchor="middle" >15</text><text class="ink3 s" x="672" y="168" text-anchor="start" >ms</text><text class="ink t" x="20" y="180" text-anchor="start" >Mutex (priority inheritance): H finishes at 5 ms</text><text class="ink t" x="72" y="207.0" text-anchor="end" >H</text><line class="ln2" x1="80" y1="216" x2="650" y2="216"/><text class="ink t" x="72" y="237.0" text-anchor="end" >M</text><line class="ln2" x1="80" y1="246" x2="650" y2="246"/><text class="ink t" x="72" y="267.0" text-anchor="end" >L</text><line class="ln2" x1="80" y1="276" x2="650" y2="276"/><rect class="boxb" x="80.0" y="252" width="90.0" height="20" rx="3"/><text class="ink s" x="125.0" y="266.0" text-anchor="middle" >lock ↑H</text><rect class="box" x="110.0" y="192" width="60.0" height="20" rx="3"/><text class="ink s" x="140.0" y="206.0" text-anchor="middle" >blocked</text><rect class="boxg" x="170.0" y="192" width="60.0" height="20" rx="3"/><text class="ink s" x="200.0" y="206.0" text-anchor="middle" >H</text><rect class="box" x="125.0" y="222" width="105.0" height="20" rx="3"/><text class="ink s" x="177.5" y="236.0" text-anchor="middle" >waits</text><rect class="boxa" x="230.0" y="222" width="360.0" height="20" rx="3"/><text class="ink s" x="410.0" y="236.0" text-anchor="middle" >M runs 12 ms</text><line class="ln" x1="80" y1="284" x2="650" y2="284"/><line class="ln" x1="80" y1="284" x2="80" y2="288"/><text class="ink3 s" x="80" y="300" text-anchor="middle" >0</text><line class="ln" x1="230" y1="284" x2="230" y2="288"/><text class="ink3 s" x="230" y="300" text-anchor="middle" >5</text><line class="ln" x1="380" y1="284" x2="380" y2="288"/><text class="ink3 s" x="380" y="300" text-anchor="middle" >10</text><line class="ln" x1="530" y1="284" x2="530" y2="288"/><text class="ink3 s" x="530" y="300" text-anchor="middle" >15</text><text class="ink3 s" x="672" y="300" text-anchor="start" >ms</text><text class="ink2 s" x="320" y="318" text-anchor="middle" ><tspan x="320" dy="0">Bounded part: L&#x27;s critical section. Unbounded part: every medium task that preempts L while H waits.</tspan><tspan x="320" dy="14">Inheritance removes the second.</tspan></text></svg>
