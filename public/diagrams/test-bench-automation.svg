<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-labelledby="t"><title id="t">Automated test bench: a PC running pytest controls a bench supply, oscilloscope and multimeter and talks to the device under test over serial</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="240" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >An automated test bench</text><rect class="boxa" x="40" y="70" width="150" height="80" rx="8"/><text class="ink t" x="115.0" y="107.0" text-anchor="middle" >PC</text><text class="ink2 s" x="115.0" y="123.0" text-anchor="middle" >pytest, PyVISA, pyserial</text><text class="ink3 s" x="115" y="165" text-anchor="middle" >report: CSV / HTML</text><rect class="box" x="260" y="50" width="130" height="40" rx="8"/><text class="ink t" x="325.0" y="67.0" text-anchor="middle" >Bench supply</text><text class="ink2 s" x="325.0" y="83.0" text-anchor="middle" >SCPI over USB/LAN</text><rect class="box" x="260" y="100" width="130" height="40" rx="8"/><text class="ink t" x="325.0" y="117.0" text-anchor="middle" >Oscilloscope</text><text class="ink2 s" x="325.0" y="133.0" text-anchor="middle" >captures</text><rect class="box" x="260" y="150" width="130" height="40" rx="8"/><text class="ink t" x="325.0" y="167.0" text-anchor="middle" >Multimeter / load</text><text class="ink2 s" x="325.0" y="183.0" text-anchor="middle" >readings</text><rect class="boxg" x="460" y="90" width="150" height="60" rx="8"/><text class="ink t" x="535.0" y="117.0" text-anchor="middle" >Device under test</text><text class="ink2 s" x="535.0" y="133.0" text-anchor="middle" >serial console, GPIO</text><line class="ln2" x1="190" y1="70" x2="260" y2="70" marker-end="url(#ar)"/><line class="ln2" x1="190" y1="120" x2="260" y2="120" marker-end="url(#ar)"/><line class="ln2" x1="190" y1="170" x2="260" y2="170" marker-end="url(#ar)"/><line class="ln" x1="190" y1="110" x2="460" y2="112" marker-end="url(#ar)"/><text class="ink2 s" x="400" y="104" text-anchor="middle" >serial: commands and logs</text><line class="ln" x1="390" y1="70" x2="430" y2="70"/><line class="ln" x1="430" y1="70" x2="430" y2="95"/><line class="ln" x1="430" y1="95" x2="460" y2="100" marker-end="url(#ar)"/><text class="ink3 s" x="435" y="62" text-anchor="start" >power</text><line class="ln" x1="390" y1="120" x2="435" y2="120"/><line class="ln" x1="435" y1="120" x2="460" y2="125" marker-end="url(#ar)"/><text class="ink3 s" x="425" y="134" text-anchor="start" >probe</text><text class="ink2 s" x="320" y="222" text-anchor="middle" >Fixtures open the ports once; tests ask the DUT, read the instruments, and assert. Waiting on a reply beats a sleep every time.</text></svg>
