<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 206" width="640" height="206" role="img" aria-labelledby="t"><title id="t">I2C write transaction showing start, seven bit address, write bit, acknowledge, data byte, acknowledge and stop</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="206" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >An I2C write: address, acknowledge, data, acknowledge, stop</text><rect class="boxa" x="30.0" y="70" width="29.0" height="40" rx="4"/><text class="ink s" x="44.5" y="94.0" text-anchor="middle" >S</text><text class="ink2 s" x="44.5" y="124" text-anchor="middle" >start</text><rect class="box" x="59.0" y="70" width="203.0" height="40" rx="4"/><text class="ink t" x="160.5" y="94.0" text-anchor="middle" >7-bit address</text><text class="ink2 s" x="160.5" y="124" text-anchor="middle" >0x48</text><rect class="box" x="262.0" y="70" width="29.0" height="40" rx="4"/><text class="ink s" x="276.5" y="94.0" text-anchor="middle" >W</text><text class="ink2 s" x="276.5" y="124" text-anchor="middle" >R/W = 0</text><rect class="boxg" x="291.0" y="70" width="29.0" height="40" rx="4"/><text class="ink s" x="305.5" y="94.0" text-anchor="middle" >A</text><text class="ink2 s" x="305.5" y="124" text-anchor="middle" >ACK from device</text><rect class="box" x="320.0" y="70" width="232.0" height="40" rx="4"/><text class="ink t" x="436.0" y="94.0" text-anchor="middle" >Data byte</text><text class="ink2 s" x="436.0" y="124" text-anchor="middle" >register / value</text><rect class="boxg" x="552.0" y="70" width="29.0" height="40" rx="4"/><text class="ink s" x="566.5" y="94.0" text-anchor="middle" >A</text><text class="ink2 s" x="566.5" y="124" text-anchor="middle" >ACK</text><rect class="boxa" x="581.0" y="70" width="29.0" height="40" rx="4"/><text class="ink s" x="595.5" y="94.0" text-anchor="middle" >P</text><text class="ink2 s" x="595.5" y="124" text-anchor="middle" >stop</text><text class="ink2 s" x="320" y="150" text-anchor="middle" >SDA changes only while SCL is low; START and STOP are the two exceptions, and that is how they are recognised.</text><text class="ink2 s" x="320" y="168" text-anchor="middle" >No ACK after the address: wrong address, device unpowered, pull-ups missing, or the bus held low by a stuck device.</text><text class="ink2 s" x="320" y="186" text-anchor="middle" >Pull-up size: small enough to rise within the bit time against the bus capacitance, large enough not to exceed the device&#x27;s sink current.</text></svg>
