    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="356" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >The product lifecycle an owner is responsible for</text><rect class="boxa" x="272.0" y="41.0" width="96" height="28" rx="14"/><text class="ink t" x="320.0" y="59.0" text-anchor="middle" >Need</text><rect class="box" x="339.49269901708664" y="65.5653334725073" width="96" height="28" rx="14"/><text class="ink t" x="387.49269901708664" y="83.5653334725073" text-anchor="middle" >Requirements</text><rect class="box" x="375.40481406628186" y="127.76694134497231" width="96" height="28" rx="14"/><text class="ink t" x="423.40481406628186" y="145.7669413449723" text-anchor="middle" >Architecture</text><rect class="box" x="362.93266739736606" y="198.5" width="96" height="28" rx="14"/><text class="ink t" x="410.93266739736606" y="216.5" text-anchor="middle" >Design</text><rect class="box" x="307.9121150491952" y="244.66772518252037" width="96" height="28" rx="14"/><text class="ink t" x="355.9121150491952" y="262.66772518252037" text-anchor="middle" >Build</text><rect class="box" x="236.08788495080478" y="244.66772518252037" width="96" height="28" rx="14"/><text class="ink t" x="284.0878849508048" y="262.66772518252037" text-anchor="middle" >Verify</text><rect class="boxa" x="181.06733260263394" y="198.50000000000003" width="96" height="28" rx="14"/><text class="ink t" x="229.06733260263394" y="216.50000000000003" text-anchor="middle" >Release</text><rect class="box" x="168.59518593371814" y="127.76694134497234" width="96" height="28" rx="14"/><text class="ink t" x="216.59518593371814" y="145.76694134497234" text-anchor="middle" >Operate</text><rect class="box" x="204.50730098291336" y="65.56533347250732" width="96" height="28" rx="14"/><text class="ink t" x="252.50730098291336" y="83.56533347250732" text-anchor="middle" >Change</text><line class="ln" x1="366.98463103929544" y1="72.10100716628344" x2="338.6286827362194" y2="61.780286019572536" marker-end="url(#ar)"/><line class="ln" x1="412.49269901708664" y1="122.86660366172924" x2="397.40481406628186" y2="96.73362034818149" marker-end="url(#ar)"/><line class="ln" x1="414.72240518293535" y1="191.00732899558272" x2="419.96237263604644" y2="161.28999684336517" marker-end="url(#ar)"/><line class="ln" x1="372.63044524141714" y1="244.63938048432698" x2="395.7464260913821" y2="225.24276947882032" marker-end="url(#ar)"/><line class="ln" x1="305.9121150491952" y1="258.66772518252037" x2="336.0878849508048" y2="258.66772518252037" marker-end="url(#ar)"/><line class="ln" x1="245.78566279485585" y1="226.52834469819342" x2="268.9016436448208" y2="245.92495570370005" marker-end="url(#ar)"/><line class="ln" x1="220.38492371928743" y1="163.2596123493896" x2="225.62489117239852" y2="192.97694450160716" marker-end="url(#ar)"/><line class="ln" x1="241.59518593371814" y1="98.4656711557504" x2="226.50730098291336" y2="124.59865446929814" marker-end="url(#ar)"/><line class="ln" x1="299.4919320222088" y1="62.464326306223874" x2="271.13598371913275" y2="72.78504745293478" marker-end="url(#ar)"/><text class="ink2 s" x="320" y="150" text-anchor="middle" >decision records,</text><text class="ink2 s" x="320" y="164" text-anchor="middle" >BOM &amp; cost, risk register,</text><text class="ink2 s" x="320" y="178" text-anchor="middle" >reviews, roadmap</text><text class="ink2 s" x="320" y="296" text-anchor="middle" ><tspan x="320" dy="0">Ownership is shown by the artefacts in the middle and by following a change all the way round, more</tspan><tspan x="320" dy="14">than once.</tspan></text></svg>
