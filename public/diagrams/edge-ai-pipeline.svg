<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 234" width="640" height="234" role="img" aria-labelledby="t"><title id="t">Edge AI pipeline from data and a non ML baseline through training, quantisation, deployment on a microcontroller and monitoring</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="234" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >An edge-AI pipeline, with the checks that keep it honest</text><rect class="box" x="20" y="80" width="90" height="56" rx="8"/><text class="ink t" x="65.0" y="105.0" text-anchor="middle" >Data</text><text class="ink2 s" x="65.0" y="121.0" text-anchor="middle" >public / synthetic</text><rect class="boxb" x="125" y="80" width="90" height="56" rx="8"/><text class="ink t" x="170.0" y="105.0" text-anchor="middle" >Baseline</text><text class="ink2 s" x="170.0" y="121.0" text-anchor="middle" >non-ML threshold</text><rect class="box" x="230" y="80" width="90" height="56" rx="8"/><text class="ink t" x="275.0" y="105.0" text-anchor="middle" >Train + split</text><text class="ink2 s" x="275.0" y="121.0" text-anchor="middle" >no leakage</text><rect class="boxa" x="335" y="80" width="90" height="56" rx="8"/><text class="ink t" x="380.0" y="105.0" text-anchor="middle" >Quantise</text><text class="ink2 s" x="380.0" y="121.0" text-anchor="middle" >int8 + loss</text><rect class="boxg" x="440" y="80" width="90" height="56" rx="8"/><text class="ink t" x="485.0" y="105.0" text-anchor="middle" >Deploy</text><text class="ink2 s" x="485.0" y="121.0" text-anchor="middle" >RAM, latency</text><rect class="box" x="545" y="80" width="90" height="56" rx="8"/><text class="ink t" x="590.0" y="105.0" text-anchor="middle" >Monitor</text><text class="ink2 s" x="590.0" y="121.0" text-anchor="middle" >drift, alarms</text><line class="ln" x1="110" y1="108" x2="125" y2="108" marker-end="url(#ar)"/><line class="ln" x1="215" y1="108" x2="230" y2="108" marker-end="url(#ar)"/><line class="ln" x1="320" y1="108" x2="335" y2="108" marker-end="url(#ar)"/><line class="ln" x1="425" y1="108" x2="440" y2="108" marker-end="url(#ar)"/><line class="ln" x1="530" y1="108" x2="545" y2="108" marker-end="url(#ar)"/><text class="ink2 s" x="320" y="170" text-anchor="middle" ><tspan x="320" dy="0">A model that does not beat the baseline on held-out data is not a result. Passing on the bench is</tspan><tspan x="320" dy="14">not flight safety; DO-178C does not cover learned behaviour.</tspan></text></svg>
