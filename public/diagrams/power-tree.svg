<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" width="640" height="344" role="img" aria-labelledby="t"><title id="t">Power tree from a 5 volt input through a buck and an LDO to loads, with the trace resistance that makes the radio&#x27;s rail sag</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="344" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >A power tree, and where the rail actually sags</text><rect class="box" x="250" y="40" width="140" height="40" rx="8"/><text class="ink t" x="320.0" y="57.0" text-anchor="middle" >USB input 5 V</text><text class="ink2 s" x="320.0" y="73.0" text-anchor="middle" >budget 500 mA</text><rect class="boxa" x="60" y="120" width="170" height="44" rx="8"/><text class="ink t" x="145.0" y="139.0" text-anchor="middle" >Buck 3.3 V digital</text><text class="ink2 s" x="145.0" y="155.0" text-anchor="middle" >min input 4.0 V · 1 A</text><rect class="boxa" x="260" y="120" width="150" height="44" rx="8"/><text class="ink t" x="335.0" y="139.0" text-anchor="middle" >LDO 3.3 V analogue</text><text class="ink2 s" x="335.0" y="155.0" text-anchor="middle" >min input 3.6 V · 12 mW</text><rect class="box" x="440" y="120" width="150" height="44" rx="8"/><text class="ink t" x="515.0" y="139.0" text-anchor="middle" >Internal 1.2 V core</text><text class="ink2 s" x="515.0" y="155.0" text-anchor="middle" >inside the MCU</text><line class="ln" x1="300" y1="80" x2="145" y2="118" marker-end="url(#ar)"/><line class="ln" x1="320" y1="80" x2="335" y2="118" marker-end="url(#ar)"/><line class="ln" x1="340" y1="80" x2="500" y2="118" marker-end="url(#ar)"/><rect class="box" x="20" y="210" width="90" height="40" rx="8"/><text class="ink t" x="65.0" y="227.0" text-anchor="middle" >MCU</text><text class="ink2 s" x="65.0" y="243.0" text-anchor="middle" >60 mA</text><rect class="box" x="120" y="210" width="90" height="40" rx="8"/><text class="ink t" x="165.0" y="227.0" text-anchor="middle" >Flash</text><text class="ink2 s" x="165.0" y="243.0" text-anchor="middle" >20 mA</text><rect class="boxb" x="230" y="200" width="150" height="56" rx="8"/><text class="ink t" x="305" y="222" text-anchor="middle" >Radio</text><text class="ink2 s" x="305" y="238" text-anchor="middle" >800 mA for 20 ms</text><text class="amb s" x="305" y="250" text-anchor="middle" >sees 2.98 V, not 3.30 V</text><rect class="box" x="400" y="210" width="100" height="40" rx="8"/><text class="ink t" x="450.0" y="227.0" text-anchor="middle" >Sensor</text><text class="ink2 s" x="450.0" y="243.0" text-anchor="middle" >resets &lt; 3.0 V</text><line class="ln" x1="100" y1="164" x2="65" y2="208" marker-end="url(#ar)"/><line class="ln" x1="145" y1="164" x2="165" y2="208" marker-end="url(#ar)"/><line class="sigb" x1="190" y1="164" x2="300" y2="198"/><text class="amb s" x="215" y="190" text-anchor="middle" >40 cm trace + connector ≈ 0.4 Ω</text><line class="ln" x1="335" y1="164" x2="450" y2="208" marker-end="url(#ar)"/><text class="ink2 s" x="320" y="282" text-anchor="middle" >sag = I × R = 0.8 A × 0.4 Ω = 0.32 V. Measure at the load, under load, with a scope.</text></svg>
