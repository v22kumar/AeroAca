<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 268" width="640" height="268" role="img" aria-labelledby="t"><title id="t">Two MIL-STD-1553B message formats on a timeline: controller to terminal with data then status, and terminal to controller with status then data, with the response time window and intermessage gap</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="268" rx="12"/><text class="ink ttl" x="320" y="22" text-anchor="middle" >1553 messages and the timing that judges them</text><text class="ink t" x="20" y="46" text-anchor="start" >Controller → terminal (receive): command, N data, then status</text><text class="ink t" x="72" y="73.0" text-anchor="end" >BC</text><line class="ln2" x1="80" y1="82" x2="626.0" y2="82"/><text class="ink t" x="72" y="103.0" text-anchor="end" >RT</text><line class="ln2" x1="80" y1="112" x2="626.0" y2="112"/><rect class="boxa" x="80.0" y="58" width="84.0" height="20" rx="3"/><text class="ink s" x="122.0" y="72.0" text-anchor="middle" >command (T/R=0)</text><rect class="box" x="164.0" y="58" width="84.0" height="20" rx="3"/><text class="ink s" x="206.0" y="72.0" text-anchor="middle" >data</text><rect class="box" x="248.0" y="58" width="84.0" height="20" rx="3"/><text class="ink s" x="290.0" y="72.0" text-anchor="middle" >data</text><rect class="boxg" x="365.6" y="88" width="84.0" height="20" rx="3"/><text class="ink s" x="407.6" y="102.0" text-anchor="middle" >status</text><line class="ln" x1="80" y1="120" x2="626.0" y2="120"/><line class="ln" x1="80.0" y1="120" x2="80.0" y2="124"/><text class="ink3 s" x="80.0" y="136" text-anchor="middle" >0</text><line class="ln" x1="164.0" y1="120" x2="164.0" y2="124"/><text class="ink3 s" x="164.0" y="136" text-anchor="middle" >20</text><line class="ln" x1="248.0" y1="120" x2="248.0" y2="124"/><text class="ink3 s" x="248.0" y="136" text-anchor="middle" >40</text><line class="ln" x1="332.0" y1="120" x2="332.0" y2="124"/><text class="ink3 s" x="332.0" y="136" text-anchor="middle" >60</text><line class="ln" x1="416.0" y1="120" x2="416.0" y2="124"/><text class="ink3 s" x="416.0" y="136" text-anchor="middle" >80</text><line class="ln" x1="500.0" y1="120" x2="500.0" y2="124"/><text class="ink3 s" x="500.0" y="136" text-anchor="middle" >100</text><line class="ln" x1="584.0" y1="120" x2="584.0" y2="124"/><text class="ink3 s" x="584.0" y="136" text-anchor="middle" >120</text><text class="ink3 s" x="626.0" y="136" text-anchor="end" >µs</text><text class="amb s" x="348.8" y="104" text-anchor="middle" >4–12 µs</text><text class="ink t" x="20" y="148" text-anchor="start" >Terminal → controller (transmit): command, then status + N data; ≥ 4 µs gap to the next message</text><text class="ink t" x="72" y="175.0" text-anchor="end" >BC</text><line class="ln2" x1="80" y1="184" x2="626.0" y2="184"/><text class="ink t" x="72" y="205.0" text-anchor="end" >RT</text><line class="ln2" x1="80" y1="214" x2="626.0" y2="214"/><rect class="boxa" x="80.0" y="160" width="84.0" height="20" rx="3"/><text class="ink s" x="122.0" y="174.0" text-anchor="middle" >command (T/R=1)</text><rect class="boxg" x="197.6" y="190" width="84.0" height="20" rx="3"/><text class="ink s" x="239.6" y="204.0" text-anchor="middle" >status</text><rect class="box" x="281.6" y="190" width="84.0" height="20" rx="3"/><text class="ink s" x="323.6" y="204.0" text-anchor="middle" >data</text><rect class="box" x="365.6" y="190" width="84.0" height="20" rx="3"/><text class="ink s" x="407.6" y="204.0" text-anchor="middle" >data</text><rect class="boxa" x="466.4" y="160" width="84.0" height="20" rx="3"/><text class="ink s" x="508.40000000000003" y="174.0" text-anchor="middle" >next command</text><line class="ln" x1="80" y1="222" x2="626.0" y2="222"/><line class="ln" x1="80.0" y1="222" x2="80.0" y2="226"/><text class="ink3 s" x="80.0" y="238" text-anchor="middle" >0</text><line class="ln" x1="164.0" y1="222" x2="164.0" y2="226"/><text class="ink3 s" x="164.0" y="238" text-anchor="middle" >20</text><line class="ln" x1="248.0" y1="222" x2="248.0" y2="226"/><text class="ink3 s" x="248.0" y="238" text-anchor="middle" >40</text><line class="ln" x1="332.0" y1="222" x2="332.0" y2="226"/><text class="ink3 s" x="332.0" y="238" text-anchor="middle" >60</text><line class="ln" x1="416.0" y1="222" x2="416.0" y2="226"/><text class="ink3 s" x="416.0" y="238" text-anchor="middle" >80</text><line class="ln" x1="500.0" y1="222" x2="500.0" y2="226"/><text class="ink3 s" x="500.0" y="238" text-anchor="middle" >100</text><line class="ln" x1="584.0" y1="222" x2="584.0" y2="226"/><text class="ink3 s" x="584.0" y="238" text-anchor="middle" >120</text><text class="ink3 s" x="626.0" y="238" text-anchor="end" >µs</text><text class="amb s" x="180.8" y="206" text-anchor="middle" >4–12 µs</text><text class="ink2 s" x="320" y="250" text-anchor="middle" >No status within 14 µs = no response: corrupted command, illegal command for that terminal, broadcast (by design), wrong bus, late terminal.</text></svg>
