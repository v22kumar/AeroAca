<rect class="bg" x="0" y="0" width="640" height="320" rx="12"/><text class="ink ttl" x="320" y="26" text-anchor="middle" >Four pathways over shared foundations</text><rect class="box" x="20" y="230" width="600" height="54" rx="8"/><text class="ink t" x="320.0" y="254.0" text-anchor="middle" >Shared foundations: modules 1 to 16</text><text class="ink2 s" x="320.0" y="270.0" text-anchor="middle" >fundamentals · PCB · MCU · interfaces · C · C++ · firmware · RTOS · Linux · instruments · integration · verification · Python · standards · applications · communication</text><rect class="boxa" x="20" y="50" width="140" height="150" rx="10"/><text class="acc ttl" x="90" y="72" text-anchor="middle" >A</text><text class="ink t" x="90" y="92" text-anchor="middle" >Embedded</text><text class="ink t" x="90" y="108" text-anchor="middle" >&amp; Electronics R&amp;D</text><text class="ink2 s" x="90" y="134" text-anchor="middle" >20, 22, 23</text><text class="ink2 s" x="90" y="148" text-anchor="middle" >18.4–18.7</text><text class="ink2 s" x="90" y="162" text-anchor="middle" >17.3–17.5</text><text class="ink2 s" x="90" y="176" text-anchor="middle" >21.3–21.4</text><text class="ink2 s" x="90" y="190" text-anchor="middle" >later 31</text><text class="ink3 s" x="90" y="192" text-anchor="middle" >principal, long term</text><line class="ln" x1="90" y1="228" x2="90" y2="204" marker-end="url(#ar)"/><rect class="boxa" x="170" y="50" width="140" height="150" rx="10"/><text class="acc ttl" x="240" y="72" text-anchor="middle" >B</text><text class="ink t" x="240" y="92" text-anchor="middle" >Aerospace</text><text class="ink t" x="240" y="108" text-anchor="middle" >&amp; Systems</text><text class="ink2 s" x="240" y="134" text-anchor="middle" >17, 18, 19, 20, 21, 24, 25</text><text class="ink2 s" x="240" y="148" text-anchor="middle" >26, 27</text><text class="ink2 s" x="240" y="162" text-anchor="middle" >30 optional</text><text class="ink3 s" x="240" y="192" text-anchor="middle" >principal, best now</text><line class="ln" x1="240" y1="228" x2="240" y2="204" marker-end="url(#ar)"/><rect class="box" x="320" y="50" width="140" height="150" rx="10"/><text class="acc ttl" x="390" y="72" text-anchor="middle" >C</text><text class="ink t" x="390" y="92" text-anchor="middle" >AI</text><text class="ink t" x="390" y="108" text-anchor="middle" >&amp; Intelligent Systems</text><text class="ink2 s" x="390" y="134" text-anchor="middle" >28, 27, 26, 29, 30</text><text class="ink2 s" x="390" y="148" text-anchor="middle" >22</text><text class="ink3 s" x="390" y="192" text-anchor="middle" >optional, after the core</text><line class="ln" x1="390" y1="228" x2="390" y2="204" marker-end="url(#ar)"/><rect class="box" x="470" y="50" width="140" height="150" rx="10"/><text class="acc ttl" x="540" y="72" text-anchor="middle" >D</text><text class="ink t" x="540" y="92" text-anchor="middle" >Leadership</text><text class="ink t" x="540" y="108" text-anchor="middle" >&amp; Ownership</text><text class="ink2 s" x="540" y="134" text-anchor="middle" >31</text><text class="ink2 s" x="540" y="148" text-anchor="middle" >17, 19, 21, 25</text><text class="ink3 s" x="540" y="192" text-anchor="middle" >long-term extension</text><line class="ln" x1="540" y1="228" x2="540" y2="204" marker-end="url(#ar)"/><text class="ink3 s" x="320" y="306" text-anchor="middle" >One lesson can serve several pathways. Switching pathway changes order, never progress.</text></svg>
