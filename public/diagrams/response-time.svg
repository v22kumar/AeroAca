<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 254" width="640" height="254" role="img" aria-labelledby="t"><title id="t">Timeline showing a low priority task&#x27;s worst case response time of 14 milliseconds under two higher priority periodic tasks and one millisecond of blocking</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="254" rx="12"/><text class="ink ttl" x="320" y="22" text-anchor="middle" >Worst-case response time: C (5 ms, blocked 1 ms) under A (2 every 10) and B (4 every 20) finishes at 14 ms</text><text class="ink t" x="72" y="63.0" text-anchor="end" >A</text><line class="ln2" x1="80" y1="72" x2="620" y2="72"/><text class="ink t" x="72" y="93.0" text-anchor="end" >B</text><line class="ln2" x1="80" y1="102" x2="620" y2="102"/><text class="ink t" x="72" y="123.0" text-anchor="end" >C</text><line class="ln2" x1="80" y1="132" x2="620" y2="132"/><text class="ink t" x="72" y="153.0" text-anchor="end" >lock</text><line class="ln2" x1="80" y1="162" x2="620" y2="162"/><rect class="boxa" x="80.0" y="48" width="54.0" height="20" rx="3"/><text class="ink s" x="107.0" y="62.0" text-anchor="middle" >A</text><rect class="boxb" x="134.0" y="78" width="108.0" height="20" rx="3"/><text class="ink s" x="188.0" y="92.0" text-anchor="middle" >B</text><rect class="box" x="242.0" y="138" width="27.0" height="20" rx="3"/><text class="ink s" x="255.5" y="152.0" text-anchor="middle" >lower task holds lock: B = 1</text><rect class="boxg" x="269.0" y="108" width="81.0" height="20" rx="3"/><text class="ink s" x="309.5" y="122.0" text-anchor="middle" >C 3 ms</text><rect class="boxa" x="350.0" y="48" width="54.0" height="20" rx="3"/><text class="ink s" x="377.0" y="62.0" text-anchor="middle" >A again</text><rect class="boxg" x="404.0" y="108" width="54.0" height="20" rx="3"/><text class="ink s" x="431.0" y="122.0" text-anchor="middle" >C 2 ms</text><line class="ln" x1="80" y1="170" x2="620" y2="170"/><line class="ln" x1="80" y1="170" x2="80" y2="174"/><text class="ink3 s" x="80" y="186" text-anchor="middle" >0</text><line class="ln" x1="134" y1="170" x2="134" y2="174"/><text class="ink3 s" x="134" y="186" text-anchor="middle" >2</text><line class="ln" x1="188" y1="170" x2="188" y2="174"/><text class="ink3 s" x="188" y="186" text-anchor="middle" >4</text><line class="ln" x1="242" y1="170" x2="242" y2="174"/><text class="ink3 s" x="242" y="186" text-anchor="middle" >6</text><line class="ln" x1="296" y1="170" x2="296" y2="174"/><text class="ink3 s" x="296" y="186" text-anchor="middle" >8</text><line class="ln" x1="350" y1="170" x2="350" y2="174"/><text class="ink3 s" x="350" y="186" text-anchor="middle" >10</text><line class="ln" x1="404" y1="170" x2="404" y2="174"/><text class="ink3 s" x="404" y="186" text-anchor="middle" >12</text><line class="ln" x1="458" y1="170" x2="458" y2="174"/><text class="ink3 s" x="458" y="186" text-anchor="middle" >14</text><line class="ln" x1="512" y1="170" x2="512" y2="174"/><text class="ink3 s" x="512" y="186" text-anchor="middle" >16</text><line class="ln" x1="566" y1="170" x2="566" y2="174"/><text class="ink3 s" x="566" y="186" text-anchor="middle" >18</text><line class="ln" x1="620" y1="170" x2="620" y2="174"/><text class="ink3 s" x="620" y="186" text-anchor="middle" >20</text><text class="ink3 s" x="620" y="186" text-anchor="end" >ms</text><line class="ln2" x1="458" y1="44" x2="458" y2="170"/><text class="acc t" x="458" y="184" text-anchor="middle" >R = 14</text><text class="m" x="320" y="216" text-anchor="middle" >R = C + B + Σ ⌈R / Tj⌉ Cj over higher-priority tasks, iterated: 6 → 12 → 14 → 14. Interrupts count as the highest-priority tasks.</text><text class="ink2 s" x="320" y="236" text-anchor="middle" >Average CPU load says nothing about this picture; the critical instant does.</text></svg>
