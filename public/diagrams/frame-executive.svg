<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 242" width="640" height="242" role="img" aria-labelledby="t"><title id="t">Timeline of a frame based executive with ten minor frames in a 100 millisecond major frame, showing the 100, 50 and 10 hertz rate groups and idle time</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="242" rx="12"/><text class="ink ttl" x="320" y="22" text-anchor="middle" >A frame-based executive: 100 ms major frame, 10 minor frames of 10 ms</text><text class="ink t" x="72" y="63.0" text-anchor="end" >100 Hz</text><line class="ln2" x1="80" y1="72" x2="620.0" y2="72"/><text class="ink t" x="72" y="93.0" text-anchor="end" >50 Hz</text><line class="ln2" x1="80" y1="102" x2="620.0" y2="102"/><text class="ink t" x="72" y="123.0" text-anchor="end" >10 Hz</text><line class="ln2" x1="80" y1="132" x2="620.0" y2="132"/><text class="ink t" x="72" y="153.0" text-anchor="end" >idle</text><line class="ln2" x1="80" y1="162" x2="620.0" y2="162"/><rect class="boxa" x="80.0" y="48" width="16.2" height="20" rx="3"/><rect class="boxb" x="96.2" y="78" width="16.2" height="20" rx="3"/><rect class="boxg" x="112.4" y="108" width="16.2" height="20" rx="3"/><text class="ink s" x="120.5" y="122.0" text-anchor="middle" >log</text><rect class="box" x="128.6" y="138" width="5.4" height="20" rx="3"/><rect class="boxa" x="134.0" y="48" width="16.2" height="20" rx="3"/><rect class="box" x="150.2" y="138" width="37.8" height="20" rx="3"/><rect class="boxa" x="188.0" y="48" width="16.2" height="20" rx="3"/><rect class="boxb" x="204.2" y="78" width="16.2" height="20" rx="3"/><rect class="box" x="220.4" y="138" width="21.6" height="20" rx="3"/><rect class="boxa" x="242.0" y="48" width="16.2" height="20" rx="3"/><rect class="box" x="258.2" y="138" width="37.8" height="20" rx="3"/><rect class="boxa" x="296.0" y="48" width="16.2" height="20" rx="3"/><rect class="boxb" x="312.2" y="78" width="16.2" height="20" rx="3"/><rect class="box" x="328.4" y="138" width="21.6" height="20" rx="3"/><rect class="boxa" x="350.0" y="48" width="16.2" height="20" rx="3"/><rect class="box" x="366.2" y="138" width="37.8" height="20" rx="3"/><rect class="boxa" x="404.0" y="48" width="16.2" height="20" rx="3"/><rect class="boxb" x="420.2" y="78" width="16.2" height="20" rx="3"/><rect class="box" x="436.4" y="138" width="21.6" height="20" rx="3"/><rect class="boxa" x="458.0" y="48" width="16.2" height="20" rx="3"/><rect class="box" x="474.2" y="138" width="37.8" height="20" rx="3"/><rect class="boxa" x="512.0" y="48" width="16.2" height="20" rx="3"/><rect class="boxb" x="528.2" y="78" width="16.2" height="20" rx="3"/><rect class="box" x="544.4" y="138" width="21.6" height="20" rx="3"/><rect class="boxa" x="566.0" y="48" width="16.2" height="20" rx="3"/><rect class="box" x="582.2" y="138" width="37.8" height="20" rx="3"/><line class="ln" x1="80" y1="170" x2="620.0" y2="170"/><line class="ln" x1="80.0" y1="170" x2="80.0" y2="174"/><text class="ink3 s" x="80.0" y="186" text-anchor="middle" >0</text><line class="ln" x1="134.0" y1="170" x2="134.0" y2="174"/><text class="ink3 s" x="134.0" y="186" text-anchor="middle" >10</text><line class="ln" x1="188.0" y1="170" x2="188.0" y2="174"/><text class="ink3 s" x="188.0" y="186" text-anchor="middle" >20</text><line class="ln" x1="242.0" y1="170" x2="242.0" y2="174"/><text class="ink3 s" x="242.0" y="186" text-anchor="middle" >30</text><line class="ln" x1="296.0" y1="170" x2="296.0" y2="174"/><text class="ink3 s" x="296.0" y="186" text-anchor="middle" >40</text><line class="ln" x1="350.0" y1="170" x2="350.0" y2="174"/><text class="ink3 s" x="350.0" y="186" text-anchor="middle" >50</text><line class="ln" x1="404.0" y1="170" x2="404.0" y2="174"/><text class="ink3 s" x="404.0" y="186" text-anchor="middle" >60</text><line class="ln" x1="458.0" y1="170" x2="458.0" y2="174"/><text class="ink3 s" x="458.0" y="186" text-anchor="middle" >70</text><line class="ln" x1="512.0" y1="170" x2="512.0" y2="174"/><text class="ink3 s" x="512.0" y="186" text-anchor="middle" >80</text><line class="ln" x1="566.0" y1="170" x2="566.0" y2="174"/><text class="ink3 s" x="566.0" y="186" text-anchor="middle" >90</text><line class="ln" x1="620.0" y1="170" x2="620.0" y2="174"/><text class="ink3 s" x="620.0" y="186" text-anchor="middle" >100</text><text class="ink3 s" x="620.0" y="186" text-anchor="end" >ms</text><line class="ln2" x1="80.0" y1="44" x2="80.0" y2="164"/><line class="ln2" x1="134.0" y1="44" x2="134.0" y2="164"/><line class="ln2" x1="188.0" y1="44" x2="188.0" y2="164"/><line class="ln2" x1="242.0" y1="44" x2="242.0" y2="164"/><line class="ln2" x1="296.0" y1="44" x2="296.0" y2="164"/><line class="ln2" x1="350.0" y1="44" x2="350.0" y2="164"/><line class="ln2" x1="404.0" y1="44" x2="404.0" y2="164"/><line class="ln2" x1="458.0" y1="44" x2="458.0" y2="164"/><line class="ln2" x1="512.0" y1="44" x2="512.0" y2="164"/><line class="ln2" x1="566.0" y1="44" x2="566.0" y2="164"/><text class="ink2 s" x="320" y="206" text-anchor="middle" >Every minor frame runs the 100 Hz group; every second frame adds the 50 Hz group; the 10 Hz group runs once per major frame.</text><text class="ink2 s" x="320" y="224" text-anchor="middle" >An overrun is detected at the frame boundary, not hoped away: the executive records it and applies the policy (skip, degrade, reset).</text></svg>
