<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" width="640" height="190" role="img" aria-labelledby="t"><title id="t">Classic CAN data frame fields from start of frame through identifier, control, data, CRC, acknowledge and end of frame</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="190" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >A classic CAN data frame (11-bit identifier)</text><rect class="boxa" x="20.0" y="70" width="10.2" height="40" rx="4"/><text class="ink s" x="25.084745762711865" y="94.0" text-anchor="middle" >SOF</text><text class="ink2 s" x="25.084745762711865" y="124" text-anchor="middle" >1</text><rect class="boxb" x="30.2" y="70" width="111.9" height="40" rx="4"/><text class="ink t" x="86.10169491525423" y="94.0" text-anchor="middle" >Identifier</text><text class="ink2 s" x="86.10169491525423" y="124" text-anchor="middle" >11 bits, lowest wins arbitration</text><rect class="box" x="142.0" y="70" width="10.2" height="40" rx="4"/><text class="ink s" x="147.1186440677966" y="94.0" text-anchor="middle" >RTR</text><text class="ink2 s" x="147.1186440677966" y="124" text-anchor="middle" >1</text><rect class="box" x="152.2" y="70" width="10.2" height="40" rx="4"/><text class="ink s" x="157.28813559322032" y="94.0" text-anchor="middle" >IDE</text><text class="ink2 s" x="157.28813559322032" y="124" text-anchor="middle" >1</text><rect class="box" x="162.4" y="70" width="10.2" height="40" rx="4"/><text class="ink s" x="167.45762711864407" y="94.0" text-anchor="middle" >r0</text><text class="ink2 s" x="167.45762711864407" y="124" text-anchor="middle" >1</text><rect class="box" x="172.5" y="70" width="40.7" height="40" rx="4"/><text class="ink s" x="192.88135593220338" y="94.0" text-anchor="middle" >DLC</text><text class="ink2 s" x="192.88135593220338" y="124" text-anchor="middle" >data length 0–8</text><rect class="boxg" x="213.2" y="70" width="162.7" height="40" rx="4"/><text class="ink t" x="294.5762711864407" y="94.0" text-anchor="middle" >Data</text><text class="ink2 s" x="294.5762711864407" y="124" text-anchor="middle" >0 to 8 bytes (shown shortened)</text><rect class="box" x="375.9" y="70" width="152.5" height="40" rx="4"/><text class="ink t" x="452.20338983050846" y="94.0" text-anchor="middle" >CRC</text><text class="ink2 s" x="452.20338983050846" y="124" text-anchor="middle" >15 bits + delimiter</text><rect class="boxa" x="528.5" y="70" width="20.3" height="40" rx="4"/><text class="ink s" x="538.6440677966101" y="94.0" text-anchor="middle" >ACK</text><text class="ink2 s" x="538.6440677966101" y="124" text-anchor="middle" >slot + delimiter</text><rect class="box" x="548.8" y="70" width="71.2" height="40" rx="4"/><text class="ink t" x="584.4067796610169" y="94.0" text-anchor="middle" >EOF</text><text class="ink2 s" x="584.4067796610169" y="124" text-anchor="middle" >7 recessive bits</text><text class="ink2 s" x="320" y="150" text-anchor="middle" >Arbitration: every node sends its identifier bit by bit; a node that sends recessive (1) and reads dominant (0) stops and listens.</text><text class="ink2 s" x="320" y="168" text-anchor="middle" >Errors raise counters; at 128 transmit errors the node goes error-passive, at 256 bus-off, and must be recovered by software.</text></svg>
