<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 294" width="640" height="294" role="img" aria-labelledby="t"><title id="t">UART 8N1 frame timing diagram for the byte 0x4B with start bit, eight data bits least significant first, and stop bit</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="294" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >UART frame, 8N1, sending 0x4B (01001011), LSB first</text><path class="sig" d="M50,70 L96,70 L96,70 L96,130 L142,130 L142,130 L142,70 L188,70 L234,70 L234,70 L234,130 L280,130 L280,130 L280,70 L326,70 L326,70 L326,130 L372,130 L418,130 L418,130 L418,70 L464,70 L464,70 L464,130 L510,130 L510,130 L510,70 L556,70 L602,70 "/><text class="ink2 s" x="73.0" y="150" text-anchor="middle" >idle</text><line class="ln2" x1="50" y1="60" x2="50" y2="140"/><text class="ink2 s" x="119.0" y="150" text-anchor="middle" >start</text><line class="ln2" x1="96" y1="60" x2="96" y2="140"/><text class="ink2 s" x="165.0" y="150" text-anchor="middle" >b0=1</text><line class="ln2" x1="142" y1="60" x2="142" y2="140"/><text class="ink2 s" x="211.0" y="150" text-anchor="middle" >b1=1</text><line class="ln2" x1="188" y1="60" x2="188" y2="140"/><text class="ink2 s" x="257.0" y="150" text-anchor="middle" >b2=0</text><line class="ln2" x1="234" y1="60" x2="234" y2="140"/><text class="ink2 s" x="303.0" y="150" text-anchor="middle" >b3=1</text><line class="ln2" x1="280" y1="60" x2="280" y2="140"/><text class="ink2 s" x="349.0" y="150" text-anchor="middle" >b4=0</text><line class="ln2" x1="326" y1="60" x2="326" y2="140"/><text class="ink2 s" x="395.0" y="150" text-anchor="middle" >b5=0</text><line class="ln2" x1="372" y1="60" x2="372" y2="140"/><text class="ink2 s" x="441.0" y="150" text-anchor="middle" >b6=1</text><line class="ln2" x1="418" y1="60" x2="418" y2="140"/><text class="ink2 s" x="487.0" y="150" text-anchor="middle" >b7=0</text><line class="ln2" x1="464" y1="60" x2="464" y2="140"/><text class="ink2 s" x="533.0" y="150" text-anchor="middle" >stop</text><line class="ln2" x1="510" y1="60" x2="510" y2="140"/><text class="ink2 s" x="579.0" y="150" text-anchor="middle" >idle</text><line class="ln2" x1="556" y1="60" x2="556" y2="140"/><rect class="boxa" x="96" y="160" width="46" height="18" rx="3"/><text class="ink s" x="119.0" y="173" text-anchor="middle" >start</text><rect class="box" x="142" y="160" width="368" height="18" rx="3"/><text class="ink s" x="326" y="173" text-anchor="middle" >8 data bits, least significant first</text><rect class="boxg" x="510" y="160" width="46" height="18" rx="3"/><text class="ink s" x="533.0" y="173" text-anchor="middle" >stop</text><text class="ink2 s" x="320" y="210" text-anchor="middle"><tspan x="320" dy="0">One bit time = 1 / baud. At 115 200 baud that is 8.68 µs. Both ends must agree within about 2–3 % or</tspan><tspan x="320" dy="14">the last bits land in the wrong slot.</tspan></text><text class="ink2 s" x="320" y="244" text-anchor="middle"><tspan x="320" dy="0">Framing error: a stop bit that is not high. Overrun: the next byte arrived before the previous one</tspan><tspan x="320" dy="14">was read.</tspan></text></svg>
