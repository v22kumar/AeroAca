<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" width="640" height="344" role="img" aria-labelledby="t"><title id="t">Block diagram of a Cortex-M microcontroller: core, NVIC, bus matrix, flash, SRAM, clock tree, debug port and peripherals</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="344" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >Inside a microcontroller (Cortex-M class)</text><rect class="boxa" x="40" y="60" width="130" height="60" rx="8"/><text class="ink t" x="105.0" y="87.0" text-anchor="middle" >Cortex-M core</text><text class="ink2 s" x="105.0" y="103.0" text-anchor="middle" >registers, pipeline</text><rect class="boxa" x="40" y="130" width="130" height="40" rx="8"/><text class="ink t" x="105.0" y="147.0" text-anchor="middle" >NVIC</text><text class="ink2 s" x="105.0" y="163.0" text-anchor="middle" >interrupt controller</text><rect class="box" x="200" y="60" width="240" height="36" rx="8"/><text class="ink t" x="320.0" y="83.0" text-anchor="middle" >Bus matrix (AHB)</text><rect class="box" x="200" y="110" width="110" height="44" rx="8"/><text class="ink t" x="255.0" y="129.0" text-anchor="middle" >Flash</text><text class="ink2 s" x="255.0" y="145.0" text-anchor="middle" >code, constants</text><rect class="box" x="330" y="110" width="110" height="44" rx="8"/><text class="ink t" x="385.0" y="129.0" text-anchor="middle" >SRAM</text><text class="ink2 s" x="385.0" y="145.0" text-anchor="middle" >data, stack, heap</text><rect class="boxb" x="470" y="60" width="130" height="44" rx="8"/><text class="ink t" x="535.0" y="79.0" text-anchor="middle" >RCC clock tree</text><text class="ink2 s" x="535.0" y="95.0" text-anchor="middle" >enables, PLL, prescalers</text><rect class="box" x="470" y="114" width="130" height="40" rx="8"/><text class="ink t" x="535.0" y="131.0" text-anchor="middle" >Debug port</text><text class="ink2 s" x="535.0" y="147.0" text-anchor="middle" >SWD / JTAG</text><line class="ln" x1="170" y1="90" x2="200" y2="78"/><line class="ln" x1="170" y1="150" x2="200" y2="150"/><line class="ln" x1="255" y1="96" x2="255" y2="110"/><line class="ln" x1="385" y1="96" x2="385" y2="110"/><line class="ln" x1="440" y1="78" x2="470" y2="82"/><line class="ln" x1="440" y1="90" x2="470" y2="134"/><rect class="box" x="200" y="170" width="400" height="30" rx="8"/><text class="ink t" x="400.0" y="190.0" text-anchor="middle" >APB peripheral buses</text><rect class="box" x="40" y="220" width="85" height="44" rx="8"/><text class="ink t" x="82.5" y="239.0" text-anchor="middle" >GPIO</text><text class="ink2 s" x="82.5" y="255.0" text-anchor="middle" >pins</text><line class="ln" x1="82" y1="200" x2="82" y2="220"/><rect class="box" x="135" y="220" width="85" height="44" rx="8"/><text class="ink t" x="177.5" y="239.0" text-anchor="middle" >UART</text><text class="ink2 s" x="177.5" y="255.0" text-anchor="middle" >serial</text><line class="ln" x1="177" y1="200" x2="177" y2="220"/><rect class="box" x="230" y="220" width="85" height="44" rx="8"/><text class="ink t" x="272.5" y="239.0" text-anchor="middle" >SPI / I2C</text><text class="ink2 s" x="272.5" y="255.0" text-anchor="middle" >buses</text><line class="ln" x1="272" y1="200" x2="272" y2="220"/><rect class="box" x="325" y="220" width="85" height="44" rx="8"/><text class="ink t" x="367.5" y="239.0" text-anchor="middle" >Timers</text><text class="ink2 s" x="367.5" y="255.0" text-anchor="middle" >PWM, capture</text><line class="ln" x1="367" y1="200" x2="367" y2="220"/><rect class="box" x="420" y="220" width="85" height="44" rx="8"/><text class="ink t" x="462.5" y="239.0" text-anchor="middle" >ADC</text><text class="ink2 s" x="462.5" y="255.0" text-anchor="middle" >analogue in</text><line class="ln" x1="462" y1="200" x2="462" y2="220"/><rect class="box" x="515" y="220" width="85" height="44" rx="8"/><text class="ink t" x="557.5" y="239.0" text-anchor="middle" >DMA</text><text class="ink2 s" x="557.5" y="255.0" text-anchor="middle" >no CPU</text><line class="ln" x1="557" y1="200" x2="557" y2="220"/><text class="ink2 s" x="320" y="286" text-anchor="middle" ><tspan x="320" dy="0">Every peripheral needs its clock enabled in the RCC and its pins in the right GPIO mode before it</tspan><tspan x="320" dy="14">does anything.</tspan></text></svg>
