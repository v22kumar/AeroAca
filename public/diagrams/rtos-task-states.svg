<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 334" width="640" height="334" role="img" aria-labelledby="t"><title id="t">RTOS task state diagram with Ready, Running, Blocked and Suspended states and the events that move a task between them</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="334" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >RTOS task states and what moves a task between them</text><rect class="box" x="90" y="70" width="120" height="40" rx="20"/><text class="ink t" x="150" y="94" text-anchor="middle" >Ready</text><rect class="boxa" x="340" y="70" width="120" height="40" rx="20"/><text class="ink t" x="400" y="94" text-anchor="middle" >Running</text><rect class="box" x="340" y="200" width="120" height="40" rx="20"/><text class="ink t" x="400" y="224" text-anchor="middle" >Blocked</text><rect class="box" x="90" y="200" width="120" height="40" rx="20"/><text class="ink t" x="150" y="224" text-anchor="middle" >Suspended</text><line class="ln" x1="210" y1="80" x2="340" y2="80" marker-end="url(#ar)"/><text class="ink2 s" x="275" y="68" text-anchor="middle" >scheduler picks it</text><line class="ln" x1="340" y1="100" x2="210" y2="100" marker-end="url(#ar)"/><text class="ink2 s" x="275" y="116" text-anchor="middle" >preempted by a higher task</text><line class="ln" x1="400" y1="110" x2="400" y2="200" marker-end="url(#ar)"/><text class="ink2 s" x="400" y="160" text-anchor="middle" >blocking call: delay, queue, mutex</text><line class="ln" x1="345" y1="215" x2="185" y2="110" marker-end="url(#ar)"/><text class="ink2 s" x="330" y="140" text-anchor="middle" >event or timeout</text><line class="ln" x1="150" y1="110" x2="150" y2="200" marker-end="url(#ar)"/><text class="ink2 s" x="108" y="160" text-anchor="middle" >vTaskSuspend</text><line class="ln" x1="190" y1="205" x2="240" y2="100" marker-end="url(#ar)"/><text class="ink2 s" x="205" y="185" text-anchor="middle" >vTaskResume</text><text class="ink2 s" x="320" y="272" text-anchor="middle" ><tspan x="320" dy="0">Keep every task Blocked except when it has work. A task that polls is Ready or Running forever and</tspan><tspan x="320" dy="14">starves everything below it.</tspan></text></svg>
