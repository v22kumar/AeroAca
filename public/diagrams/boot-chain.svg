<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" width="640" height="306" role="img" aria-labelledby="t"><title id="t">Two boot chains side by side: microcontroller from reset vector through startup code to main, and embedded Linux from boot ROM through the bootloader and kernel to login</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="306" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >From reset to main (MCU) and from ROM to login (Linux)</text><text class="ink t" x="160" y="50" text-anchor="middle" >Microcontroller</text><rect class="boxa" x="60" y="60" width="200" height="40" rx="8"/><text class="ink t" x="160.0" y="77.0" text-anchor="middle" >Reset</text><text class="ink2 s" x="160.0" y="93.0" text-anchor="middle" >SP from vector[0], PC from vector[1]</text><line class="ln" x1="160.0" y1="100" x2="160.0" y2="110" marker-end="url(#ar)"/><rect class="box" x="60" y="112" width="200" height="40" rx="8"/><text class="ink t" x="160.0" y="129.0" text-anchor="middle" >Reset_Handler</text><text class="ink2 s" x="160.0" y="145.0" text-anchor="middle" >copy .data, zero .bss</text><line class="ln" x1="160.0" y1="152" x2="160.0" y2="162" marker-end="url(#ar)"/><rect class="box" x="60" y="164" width="200" height="40" rx="8"/><text class="ink t" x="160.0" y="181.0" text-anchor="middle" >SystemInit</text><text class="ink2 s" x="160.0" y="197.0" text-anchor="middle" >clocks, flash latency</text><line class="ln" x1="160.0" y1="204" x2="160.0" y2="214" marker-end="url(#ar)"/><rect class="boxg" x="60" y="216" width="200" height="40" rx="8"/><text class="ink t" x="160.0" y="233.0" text-anchor="middle" >main()</text><text class="ink2 s" x="160.0" y="249.0" text-anchor="middle" >your code</text><text class="ink t" x="470" y="50" text-anchor="middle" >Embedded Linux</text><rect class="boxa" x="370" y="60" width="200" height="40" rx="8"/><text class="ink t" x="470.0" y="77.0" text-anchor="middle" >Boot ROM</text><text class="ink2 s" x="470.0" y="93.0" text-anchor="middle" >fixed in silicon</text><line class="ln" x1="470.0" y1="100" x2="470.0" y2="110" marker-end="url(#ar)"/><rect class="box" x="370" y="112" width="200" height="40" rx="8"/><text class="ink t" x="470.0" y="129.0" text-anchor="middle" >SPL / U-Boot</text><text class="ink2 s" x="470.0" y="145.0" text-anchor="middle" >DRAM up, load kernel + DT</text><line class="ln" x1="470.0" y1="152" x2="470.0" y2="162" marker-end="url(#ar)"/><rect class="box" x="370" y="164" width="200" height="40" rx="8"/><text class="ink t" x="470.0" y="181.0" text-anchor="middle" >Kernel + device tree</text><text class="ink2 s" x="470.0" y="197.0" text-anchor="middle" >drivers bind to nodes</text><line class="ln" x1="470.0" y1="204" x2="470.0" y2="214" marker-end="url(#ar)"/><rect class="boxg" x="370" y="216" width="200" height="40" rx="8"/><text class="ink t" x="470.0" y="233.0" text-anchor="middle" >init / systemd → login</text><text class="ink2 s" x="470.0" y="249.0" text-anchor="middle" >user space</text><text class="ink2 s" x="320" y="290" text-anchor="middle" >Both chains fail the same way: the step that did not run leaves the next one with wrong assumptions. Find the last step that worked.</text></svg>
