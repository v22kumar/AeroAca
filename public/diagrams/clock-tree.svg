<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 354" width="640" height="354" role="img" aria-labelledby="t"><title id="t">STM32 clock tree from the 8 megahertz crystal through the PLL dividers and multiplier to 84 megahertz and the AHB and APB prescalers, with the timer doubling rule</title>
<style>
  .bg{fill:#ffffff}.ink{fill:#1f2430}.ink2{fill:#4b5160}.ink3{fill:#6b7280}
  .ln{stroke:#4b5160;fill:none;stroke-width:1.6}.ln2{stroke:#9aa0ad;fill:none;stroke-width:1.2;stroke-dasharray:4 3}
  .box{fill:#f3f4f7;stroke:#9aa0ad;stroke-width:1.2}.boxa{fill:#f9e4ec;stroke:#a63a66;stroke-width:1.4}
  .boxb{fill:#fdf1d8;stroke:#b7791f;stroke-width:1.4}.boxg{fill:#e3f3e8;stroke:#2f8f5b;stroke-width:1.4}
  .acc{fill:#a63a66}.amb{fill:#b7791f}.grn{fill:#2f8f5b}.sig{stroke:#1f2430;fill:none;stroke-width:2}
  .siga{stroke:#a63a66;fill:none;stroke-width:2}.sigb{stroke:#b7791f;fill:none;stroke-width:2}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
  .t{font-size:13px;font-weight:600}.s{font-size:11px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .ttl{font-size:14px;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#171a21}.ink{fill:#e8e6ea}.ink2{fill:#c3c6cf}.ink3{fill:#9aa0ad}
    .ln{stroke:#c3c6cf}.ln2{stroke:#6b7280}.box{fill:#242a35;stroke:#6b7280}.boxa{fill:#3b1f2d;stroke:#f08cb3}
    .boxb{fill:#3a2e14;stroke:#e0a83a}.boxg{fill:#16301f;stroke:#5fcf8a}.acc{fill:#f08cb3}.amb{fill:#e0a83a}.grn{fill:#5fcf8a}
    .sig{stroke:#e8e6ea}.siga{stroke:#f08cb3}.sigb{stroke:#e0a83a}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5160"/></marker></defs>
<rect class="bg" x="0" y="0" width="640" height="354" rx="12"/><text class="ink ttl" x="320" y="24" text-anchor="middle" >An STM32 clock tree to 84 MHz (F401/F411 class)</text><rect class="box" x="20" y="70" width="90" height="44" rx="8"/><text class="ink t" x="65.0" y="89.0" text-anchor="middle" >HSE</text><text class="ink2 s" x="65.0" y="105.0" text-anchor="middle" >8 MHz crystal</text><rect class="box" x="20" y="130" width="90" height="44" rx="8"/><text class="ink t" x="65.0" y="149.0" text-anchor="middle" >HSI</text><text class="ink2 s" x="65.0" y="165.0" text-anchor="middle" >16 MHz RC</text><rect class="boxa" x="150" y="70" width="110" height="44" rx="8"/><text class="ink t" x="205.0" y="89.0" text-anchor="middle" >PLL ÷M</text><text class="ink2 s" x="205.0" y="105.0" text-anchor="middle" >M = 8 → 1 MHz</text><rect class="boxa" x="280" y="70" width="110" height="44" rx="8"/><text class="ink t" x="335.0" y="89.0" text-anchor="middle" >PLL ×N</text><text class="ink2 s" x="335.0" y="105.0" text-anchor="middle" >N = 336 → 336 MHz</text><rect class="boxa" x="410" y="70" width="110" height="44" rx="8"/><text class="ink t" x="465.0" y="89.0" text-anchor="middle" >PLL ÷P</text><text class="ink2 s" x="465.0" y="105.0" text-anchor="middle" >P = 4 → 84 MHz</text><line class="ln" x1="110" y1="92" x2="150" y2="92" marker-end="url(#ar)"/><line class="ln" x1="260" y1="92" x2="280" y2="92" marker-end="url(#ar)"/><line class="ln" x1="390" y1="92" x2="410" y2="92" marker-end="url(#ar)"/><rect class="boxb" x="540" y="70" width="90" height="44" rx="8"/><text class="ink t" x="585.0" y="89.0" text-anchor="middle" >SYSCLK</text><text class="ink2 s" x="585.0" y="105.0" text-anchor="middle" >84 MHz</text><line class="ln" x1="520" y1="92" x2="540" y2="92" marker-end="url(#ar)"/><rect class="box" x="150" y="160" width="120" height="44" rx="8"/><text class="ink t" x="210.0" y="179.0" text-anchor="middle" >AHB prescaler ÷1</text><text class="ink2 s" x="210.0" y="195.0" text-anchor="middle" >HCLK 84 MHz</text><line class="ln" x1="585" y1="114" x2="585" y2="150" marker-end="url(#ar)"/><line class="ln" x1="585" y1="150" x2="210" y2="150"/><line class="ln" x1="210" y1="150" x2="210" y2="160" marker-end="url(#ar)"/><rect class="box" x="60" y="230" width="150" height="44" rx="8"/><text class="ink t" x="135.0" y="249.0" text-anchor="middle" >APB1 ÷2</text><text class="ink2 s" x="135.0" y="265.0" text-anchor="middle" >PCLK1 42 MHz</text><rect class="box" x="230" y="230" width="150" height="44" rx="8"/><text class="ink t" x="305.0" y="249.0" text-anchor="middle" >APB2 ÷1</text><text class="ink2 s" x="305.0" y="265.0" text-anchor="middle" >PCLK2 84 MHz</text><line class="ln" x1="190" y1="204" x2="135" y2="230" marker-end="url(#ar)"/><line class="ln" x1="230" y1="204" x2="305" y2="230" marker-end="url(#ar)"/><rect class="boxb" x="400" y="230" width="220" height="44" rx="8"/><text class="ink t" x="510.0" y="249.0" text-anchor="middle" >Timer clock rule</text><text class="ink2 s" x="510.0" y="265.0" text-anchor="middle" >APB prescaler ≠ 1 → timers get 2× PCLK</text><text class="ink2 s" x="135" y="292" text-anchor="middle" >TIM2..5 on APB1: 2 × 42 = 84 MHz</text><text class="ink2 s" x="305" y="292" text-anchor="middle" >TIM1, 9..11 on APB2: 84 MHz</text><text class="ink3 s" x="510" y="292" text-anchor="middle" >Flash wait states rise with HCLK</text></svg>
